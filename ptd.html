<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>3D 深海奇境 - Deep Sea Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #00111a; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(150, 255, 255, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">拖拽旋转 · 滚轮缩放</div>
    <script>
        // 1. 基础场景设置
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x00111a, 0.02); // 深海迷雾

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 环境光与点光源
        const ambientLight = new THREE.AmbientLight(0x002244, 1.5);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0x88ccff, 1);
        topLight.position.set(0, 50, 0);
        scene.add(topLight);

        // 3. 动态海底地形 (使用粒子网格)
        const floorGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
        const floorMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x003366, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.3 
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -10;
        scene.add(floor);

        // 保存原始顶点位置以便后续做波浪动画
        const positionAttribute = floorGeometry.attributes.position;
        const vertexArray = positionAttribute.array;
        const originalPositions = Float32Array.from(vertexArray);

        // 4. 发光水母 (核心视觉)
        const jellyfishGroup = new THREE.Group();
        jellyfishGroup.position.set(0, 0, 0);
        
        // 水母伞盖
        const capGeo = new THREE.SphereGeometry(3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const capMat = new THREE.MeshPhongMaterial({
            color: 0x00ffff,
            emissive: 0x005555,
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide,
            wireframe: false
        });
        const cap = new THREE.Mesh(capGeo, capMat);
        jellyfishGroup.add(cap);

        // 水母触须
        const tentaclesGeo = new THREE.CylinderGeometry(0.05, 0.05, 10, 8);
        const tentaclesMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
        for (let i = 0; i < 8; i++) {
            const tentacle = new THREE.Mesh(tentaclesGeo, tentaclesMat);
            const angle = (i / 8) * Math.PI * 2;
            tentacle.position.set(Math.cos(angle) * 2.5, -5, Math.sin(angle) * 2.5);
            jellyfishGroup.add(tentacle);
        }
        scene.add(jellyfishGroup);

        // 5. 漂浮气泡与浮游生物
        const particleCount = 800;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleSpeeds = []; // 记录每个粒子的上升速度

        for (let i = 0; i < particleCount; i++) {
            particlePos[i * 3] = (Math.random() - 0.5) * 80; // x
            particlePos[i * 3 + 1] = (Math.random() - 0.5) * 60; // y
            particlePos[i * 3 + 2] = (Math.random() - 0.5) * 80; // z
            particleSpeeds.push(Math.random() * 0.05 + 0.01);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        
        const particleMat = new THREE.PointsMaterial({
            color: 0xaaffff,
            size: 0.15,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // 6. 上帝之光 (光柱)
        const rayGeo = new THREE.PlaneGeometry(15, 60);
        const rayMat = new THREE.MeshBasicMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.05,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const rays = [];
        for(let i=0; i<5; i++) {
            const ray = new THREE.Mesh(rayGeo, rayMat);
            ray.position.set((Math.random() - 0.5) * 50, 10, (Math.random() - 0.5) * 50);
            ray.rotation.x = -Math.PI / 4;
            ray.rotation.z = Math.random() * Math.PI;
            scene.add(ray);
            rays.push(ray);
        }

        // 7. 交互控制 (鼠标拖拽)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };
                // 旋转整个场景（简单模拟视角旋转）
                scene.rotation.y += deltaMove.x * 0.005;
                scene.rotation.x += deltaMove.y * 0.005;
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.05;
            // 限制缩放范围
            camera.position.z = Math.max(10, Math.min(camera.position.z, 80));
        });

        // 8. 动画循环
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 海底波浪起伏
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = originalPositions[i * 3];
                const y = originalPositions[i * 3 + 1];
                // 使用正弦波计算高度
                vertexArray[i * 3 + 2] = Math.sin(x * 0.2 + time) * 1.5 + Math.cos(y * 0.2 + time) * 1.5;
            }
            positionAttribute.needsUpdate = true;

            // 气泡上浮
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3 + 1] += particleSpeeds[i];
                // 如果气泡浮出水面，重置到底部
                if (positions[i * 3 + 1] > 30) {
                    positions[i * 3 + 1] = -30;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // 水母呼吸与漂浮
            jellyfishGroup.position.y = Math.sin(time * 0.5) * 2;
            const pulse = 1 + Math.sin(time * 2) * 0.1;
            jellyfishGroup.scale.set(pulse, 1 - Math.sin(time * 2) * 0.1, pulse);
            jellyfishGroup.rotation.y += 0.002;

            // 光柱闪烁
            rays.forEach((ray, index) => {
                ray.material.opacity = 0.03 + Math.abs(Math.sin(time * 0.5 + index)) * 0.04;
            });

            renderer.render(scene, camera);
        }

        // 窗口尺寸自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
