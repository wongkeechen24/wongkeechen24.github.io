<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cosmic Pantheon</title>
  <style>
    /* ===== 基础重置 ===== */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #050510; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* ===== 宇宙星空渲染背景层 ===== */
    .cosmos-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(60% 60% at 20% 10%, rgba(122,77,255,0.15) 0%, transparent 60%),
        radial-gradient(70% 70% at 80% 90%, rgba(42,123,255,0.12) 0%, transparent 60%),
        radial-gradient(50% 50% at 50% 50%, rgba(167,139,250,0.08) 0%, transparent 60%);
    }
    .starfield {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 15%, white, transparent),
        radial-gradient(1px 1px at 90% 80%, rgba(200,200,255,0.9), transparent),
        radial-gradient(1px 1px at 40% 90%, white, transparent);
      background-size: 300px 300px;
      opacity: 0.3;
    }

    /* ===== 核心宇宙画布（拖拽区域） ===== */
    .universe-canvas {
      position: absolute; inset: 0;
      touch-action: none;
      cursor: grab;
      overflow: hidden;
      z-index: 2;
    }
    .universe-canvas:active { cursor: grabbing; }

    /* 3000x3000 的世界容器，通过 transform 控制平移缩放旋转 */
    .world-container {
      position: absolute;
      width: 3000px; height: 3000px;
      left: 0; top: 0;
      transform-origin: center center;
      will-change: transform;
    }

    /* ===== 星球（中心土星） ===== */
    .planet-system {
      position: absolute;
      left: 1500px; top: 1500px;
      width: 400px; height: 400px;
      transform: translate(-50%, -50%);
      perspective: 1200px;
      transform-style: preserve-3d;
    }
    .planet-float {
      position: absolute; inset: 0;
      animation: float 6s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(1deg); }
    }
    .planet-core {
      position: absolute;
      left: 50%; top: 50%;
      width: 180px; height: 180px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(38% 38% at 32% 28%, #d6e4ff 0%, #8ab4ff 14%, #6a7cff 28%, #5a3fd6 52%, #2a1a6a 78%, #0e0a2a 100%);
      box-shadow: inset -18px -12px 32px rgba(0,0,0,0.65), inset 10px 8px 22px rgba(180,200,255,0.55), 0 0 42px rgba(120,90,255,0.38);
      z-index: 2;
    }
    .planet-highlight {
      position: absolute; width: 46%; height: 32%; left: 18%; top: 16%;
      background: radial-gradient(60% 80% at 50% 50%, rgba(255,255,255,0.9) 0%, transparent 72%);
      filter: blur(0.6px); border-radius: 50%;
    }
    .ring-back, .ring-front {
      position: absolute; left: 50%; top: 50%;
      width: 440px; height: 440px; transform: translate(-50%, -50%);
      border-radius: 50%;
      animation: ringRotate 22s linear infinite;
    }
    .ring-back { clip-path: polygon(0 0, 100% 0, 100% 52%, 0 52%); z-index: 1; }
    .ring-front { clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%); z-index: 3; }
    @keyframes ringRotate {
      0% { transform: translate(-50%, -50%) rotateX(74deg) rotateZ(-18deg); }
      100% { transform: translate(-50%, -50%) rotateX(74deg) rotateZ(342deg); }
    }
    .ring-back-inner, .ring-front-inner {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(200,190,255,0.18);
      -webkit-mask: radial-gradient(circle, transparent 108px, black 116px, black 164px, transparent 172px);
      mask: radial-gradient(circle, transparent 108px, black 116px, black 164px, transparent 172px);
    }
    .ring-back-inner { background: conic-gradient(from 0deg, rgba(200,190,255,0.02) 0deg, rgba(180,170,255,0.32) 42deg, rgba(200,190,255,0.42) 170deg, rgba(200,190,255,0.02) 360deg); }
    .ring-front-inner { background: conic-gradient(from 0deg, rgba(220,210,255,0.08) 0deg, rgba(200,190,255,0.5) 38deg, rgba(220,210,255,0.62) 168deg, rgba(220,210,255,0.08) 360deg); box-shadow: 0 0 42px rgba(180,160,255,0.42); }

    /* ===== 生物 3D 化重构 ===== */
    .creature-anchor {
      position: absolute; width: 0; height: 0; pointer-events: none; z-index: 10;
    }
    .creature-float {
      position: absolute; left: 0; top: 0; width: 0; height: 0;
      transform-style: preserve-3d;
    }
    
    /* 不同生物不同属性的浮动、光晕 */
    .float-dialga { animation: floatDialga 9.2s ease-in-out infinite; }
    .float-palkia { animation: floatPalkia 11.4s ease-in-out infinite; }
    .float-giratina { animation: floatGiratina 12.6s ease-in-out infinite; }
    @keyframes floatDialga {
      0%, 100% { transform: translateY(0px) rotate(-2deg) scale(0.98); }
      50% { transform: translateY(-20px) rotate(3deg) scale(1.03); }
    }
    @keyframes floatPalkia {
      0%, 100% { transform: translateY(0px) rotate(2deg) scale(0.97); }
      50% { transform: translateY(-24px) rotate(-3deg) scale(1.04); }
    }
    @keyframes floatGiratina {
      0%, 100% { transform: translateY(0px) rotate(-1deg) scale(0.96); }
      50% { transform: translateY(-28px) rotate(4deg) scale(1.05); }
    }

    .creature-aura {
      position: absolute; border-radius: 50%; pointer-events: none;
      filter: blur(18px); mix-blend-mode: screen;
    }
    .aura-dialga {
      width: 280px; height: 280px; left: -140px; top: -140px;
      background: radial-gradient(55% 55% at 50% 50%, rgba(90,216,255,0.42) 0%, transparent 70%);
    }
    .aura-palkia {
      width: 340px; height: 340px; left: -170px; top: -170px;
      background: radial-gradient(55% 55% at 50% 50%, rgba(255,110,199,0.4) 0%, transparent 70%);
    }
    .aura-giratina {
      width: 400px; height: 400px; left: -200px; top: -200px;
      background: radial-gradient(60% 60% at 50% 50%, rgba(124,58,237,0.35) 0%, transparent 72%);
    }

    /* ==== 重构后的本体 ==== */
    .creature-img-wrap {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      isolation: isolate;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, rgba(0,0,0,0.6) 65%, transparent 95%);
      mask-image: radial-gradient(circle at 50% 50%, black 40%, rgba(0,0,0,0.6) 65%, transparent 95%);
    }
    .wrap-dialga { width: 260px; height: 260px; left: 0; top: 0; }
    .wrap-palkia { width: 320px; height: 320px; left: 0; top: 0; }
    .wrap-giratina { width: 360px; height: 360px; left: 0; top: 0; }

    .creature-img {
      width: 100%; height: 100%;
      object-fit: contain; object-position: center;
      display: block; border: 0;
      mix-blend-mode: luminosity; 
      opacity: 0.9;
      transform-origin: center;
      filter: contrast(1.3) brightness(1.15) saturate(1.2) drop-shadow(0px 0px 10px rgba(255,255,255,0.1));
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 45% 45%, black 60%, transparent 95%);
      mask-image: radial-gradient(ellipse 75% 75% at 45% 45%, black 60%, transparent 95%);
    }

    .creature-img-wrap::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(0,0,0,0.75) 0%, transparent 65%);
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 4;
    }

    .creature-hologram-shell {
      position: absolute; inset: 0; border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.15), inset 0 -20px 40px rgba(0,0,0,0.6);
      z-index: 3; pointer-events: none;
    }
    .creature-specular {
      position: absolute; top: 12%; left: 18%; width: 40%; height: 20%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.5) 0%, transparent 70%);
      filter: blur(6px); z-index: 5; pointer-events: none;
    }

    .img-dialga { filter: contrast(1.25) brightness(1.1) saturate(1.3) hue-rotate(-10deg); }
    .img-palkia { filter: contrast(1.3) brightness(1.12) saturate(1.4) hue-rotate(10deg); }
    .img-giratina { filter: contrast(1.35) brightness(1.05) saturate(1.2) hue-rotate(15deg); }

    /* ===== UI 控件 ===== */
    .ui-panel {
      position: absolute; top: 20px; left: 20px; z-index: 50;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      padding: 16px; width: 190px; color: white; font-family: ui-monospace, monospace;
    }
    .rotation-slider { width: 100%; height: 2px; appearance: none; background: rgba(255,255,255,0.15); border-radius: 99px; outline: none; margin: 10px 0; }
    .rotation-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }
    .ui-btn { flex: 1; height: 26px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-size: 10px; cursor: pointer; transition: 0.2s; }
    .ui-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    .ui-btn.active { background: white; color: black; border-color: white; box-shadow: 0 0 12px rgba(255,255,255,0.3); }
    
    .zoom-controls { position: absolute; bottom: 24px; right: 24px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
    .zoom-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .info-badge { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 99px; font-family: ui-monospace, monospace; font-size: 11px; pointer-events: none; }
  </style>
</head>
<body>

  <div class="cosmos-bg"></div>
  <div class="starfield"></div>

  <div class="universe-canvas" id="canvas">
    <!-- 核心世界层 -->
    <div class="world-container" id="world">
      
      <!-- 中心星球 -->
      <div class="planet-system">
        <div class="planet-float">
          <div class="ring-back"><div class="ring-back-inner"></div></div>
          <div class="planet-core">
            <div class="planet-highlight"></div>
          </div>
          <div class="ring-front"><div class="ring-front-inner"></div></div>
        </div>
      </div>

      <!-- 生物 1：帝牙卢卡 -->
      <div class="creature-anchor" style="left: 1000px; top: 1000px;">
        <div class="creature-float float-dialga">
          <div class="creature-aura aura-dialga"></div>
          <div class="creature-img-wrap wrap-dialga">
            <div class="creature-hologram-shell"></div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/483.png" alt="" class="creature-img img-dialga" draggable="false" />
            <div class="creature-specular"></div>
          </div>
        </div>
      </div>

      <!-- 生物 2：帕路奇亚 -->
      <div class="creature-anchor" style="left: 2000px; top: 1000px;">
        <div class="creature-float float-palkia">
          <div class="creature-aura aura-palkia"></div>
          <div class="creature-img-wrap wrap-palkia">
            <div class="creature-hologram-shell"></div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/484.png" alt="" class="creature-img img-palkia" draggable="false" />
            <div class="creature-specular"></div>
          </div>
        </div>
      </div>

      <!-- 生物 3：骑拉帝纳 -->
      <div class="creature-anchor" style="left: 1500px; top: 2000px;">
        <div class="creature-float float-giratina">
          <div class="creature-aura aura-giratina"></div>
          <div class="creature-img-wrap wrap-giratina">
            <div class="creature-hologram-shell"></div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/487.png" alt="" class="creature-img img-giratina" draggable="false" />
            <div class="creature-specular"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="ui-panel">
    <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:10px; letter-spacing: 0.1em;">
      <span style="color:rgba(255,255,255,0.5);">ROTATION</span>
      <span id="rot-text" style="color:white;">000°</span>
    </div>
    <input type="range" class="rotation-slider" id="rot-slider" min="0" max="360" value="0">
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button class="ui-btn" id="btn-reset">RESET</button>
      <button class="ui-btn" id="btn-auto">AUTO</button>
    </div>
    <div style="font-size:9px; color:rgba(255,255,255,0.35); line-height:1.4;">
      DRAG / WHEEL TO ZOOM<br>SHIFT+DRAG TO ROTATE
    </div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="btn-zoom-in">+</button>
    <button class="zoom-btn" id="btn-zoom-out">−</button>
  </div>

  <div class="info-badge" id="info-badge">100% • 0°</div>

  <script>
    const canvas = document.getElementById('canvas');
    const world = document.getElementById('world');
    const rotText = document.getElementById('rot-text');
    const rotSlider = document.getElementById('rot-slider');
    const infoBadge = document.getElementById('info-badge');
    const btnAuto = document.getElementById('btn-auto');

    let state = {
      scale: 0.85,
      rotation: 0,
      tx: 0,
      ty: 0,
      vx: 0, vy: 0, vScale: 0, vRotation: 0,
      isDragging: false,
      isRotating: false,
      isAuto: false,
      lastX: 0, lastY: 0,
    };

    const MIN_SCALE = 0.4;
    const MAX_SCALE = 2.5;

    // 修复：将 (1500, 1500) 的中心点精确对齐到屏幕中心
    function initPos() {
      state.scale = 0.85;
      state.rotation = 0;
      state.tx = window.innerWidth / 2 - 1500;
      state.ty = window.innerHeight / 2 - 1500;
      updateTransform();
    }
    
    window.addEventListener('resize', initPos);
    initPos();

    function updateTransform() {
      // 这里的 translate3d 的基准是 0,0 (也就是 world-container 的左上角)
      world.style.transform = `translate3d(${state.tx}px, ${state.ty}px, 0) rotate(${state.rotation}deg) scale(${state.scale})`;
      
      const deg = Math.round(((state.rotation % 360) + 360) % 360);
      rotText.innerText = String(deg).padStart(3, '0') + '°';
      rotSlider.value = deg;
      infoBadge.innerText = Math.round(state.scale * 100) + '% • ' + deg + '°';
    }

    function onPointerDown(e) {
      if (e.target.closest('.ui-panel') || e.target.closest('.zoom-controls')) return;
      
      state.isDragging = true;
      // 移动端没有 shift 键，如果是触摸或者在触控板上双指，更建议通过双指扭转或者直接用按钮。这里保留右键/Shift。
      state.isRotating = e.shiftKey || e.button === 2; 
      
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      
      state.vx = 0; state.vy = 0; state.vScale = 0; state.vRotation = 0;
    }

    function onPointerMove(e) {
      if (!state.isDragging) return;
      
      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;

      if (state.isRotating) {
        state.rotation += dx * 0.4;
        state.vRotation = dx * 0.4;
      } else {
        state.tx += dx;
        state.ty += dy;
        state.vx = dx;
        state.vy = dy;
      }

      state.lastX = e.clientX;
      state.lastY = e.clientY;
      updateTransform();
    }

    function onPointerUp() {
      if (!state.isDragging) return;
      state.isDragging = false;
    }

    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1 - e.deltaY * 0.001;
      let newScale = state.scale * zoomFactor;
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

      const scaleChange = newScale - state.scale;
      
      // 简单处理：相对于世界中心缩放，避免复杂旋转下的矩阵运算，但足够顺滑
      const rect = world.getBoundingClientRect();
      // 因为 rect 受 transform 影响，直接取视口中心
  
      // 计算鼠标相对屏幕的位置
      const mouseX = e.clientX - window.innerWidth / 2;
      const mouseY = e.clientY - window.innerHeight / 2;

      // 根据旋转和缩放动态调整平移，让鼠标指着的点在缩放时尽量保持不动
      const rad = state.rotation * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      
      // 反向旋转计算鼠标在世界坐标系中相对中心点的位置
      const worldX = mouseX * cos + mouseY * sin;
      const worldY = -mouseX * sin + mouseY * cos;
      
      state.tx -= worldX * scaleChange;
      state.ty -= worldY * scaleChange;
      
      state.scale = newScale;
      updateTransform();
    }, { passive: false });

    canvas.addEventListener('dblclick', initPos);

    function tick() {
      let needsUpdate = false;

      if (state.isAuto) {
        state.rotation += 0.15;
        needsUpdate = true;
      }

      if (!state.isDragging) {
        if (Math.abs(state.vx) > 0.05 || Math.abs(state.vy) > 0.05) {
          state.tx += state.vx;
          state.ty += state.vy;
          state.vx *= 0.94;
          state.vy *= 0.94;
          needsUpdate = true;
        } else {
          state.vx = 0; state.vy = 0;
        }

        if (Math.abs(state.vRotation) > 0.05) {
          state.rotation += state.vRotation;
          state.vRotation *= 0.92;
          needsUpdate = true;
        } else {
          state.vRotation = 0;
        }
      }

      if (needsUpdate) updateTransform();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    rotSlider.addEventListener('input', (e) => {
      state.rotation = parseInt(e.target.value);
      updateTransform();
    });

    document.getElementById('btn-reset').addEventListener('click', initPos);

    btnAuto.addEventListener('click', () => {
      state.isAuto = !state.isAuto;
      btnAuto.classList.toggle('active');
    });

    function zoom(amount) {
      let newScale = state.scale + amount;
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      state.scale = newScale;
      updateTransform();
    }
    document.getElementById('btn-zoom-in').addEventListener('click', () => zoom(0.1));
    document.getElementById('btn-zoom-out').addEventListener('click', () => zoom(-0.1));
  </script>
</body>
</html>
