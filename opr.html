<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马来西亚 OPR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    #opr {
      font-size: 42px;
      font-weight: bold;
      color: #1769aa;
      margin: 20px 0;
    }

    .info {
      color: #555;
      line-height: 1.8;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0d4f82;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>马来西亚央行 OPR</h1>

    <div id="opr">读取中...</div>

    <div id="details" class="info"></div>

    <button id="refreshBtn">重新获取</button>
  </div>

  <script>
    const API_URL = "https://api.bnm.gov.my/public/opr";

    const oprElement = document.getElementById("opr");
    const detailsElement = document.getElementById("details");
    const refreshButton = document.getElementById("refreshBtn");

    async function loadOPR() {
      oprElement.textContent = "读取中...";
      detailsElement.textContent = "";

      try {
        const response = await fetch(API_URL, {
          headers: {
            "Accept": "application/vnd.BNM.API.v1+json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP 错误：${response.status}`);
        }

        const result = await response.json();

        console.log("BNM API 返回资料：", result);

        const record = extractLatestOPR(result);

        if (!record) {
          throw new Error("找不到 OPR 数据，请检查 API 返回格式");
        }

        const rate = record.rate ?? record.value ?? record.opr;
        const date = record.date ?? record.effective_date ?? record.effectiveDate;

        oprElement.textContent = `${rate}%`;

        detailsElement.innerHTML = `
          <div>生效日期：${date || "未提供"}</div>
          <div>资料来源：Bank Negara Malaysia</div>
          <div>读取时间：${new Date().toLocaleString("zh-CN")}</div>
        `;
      } catch (error) {
        console.error(error);

        oprElement.textContent = "读取失败";
        detailsElement.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function extractLatestOPR(result) {
      if (Array.isArray(result)) {
        return result[0];
      }

      if (Array.isArray(result.data)) {
        return result.data[0];
      }

      if (Array.isArray(result.results)) {
        return result.results[0];
      }

      if (result.data && typeof result.data === "object") {
        return result.data;
      }

      if (typeof result === "object") {
        return result;
      }

      return null;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    refreshButton.addEventListener("click", loadOPR);

    loadOPR();
  </script>
</body>
</html>
