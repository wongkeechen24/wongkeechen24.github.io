<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万能网页转 App 生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #94a3b8; }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
        }
        input[type="file"] { margin-top: 6px; color: #cbd5e1; }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0369a1; }
        .preview-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            display: none;
        }
        .app-icon-preview {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            margin: 10px auto;
            display: block;
            background-color: #334155;
            object-fit: cover;
        }
        .instruction {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 万能网页转 App 工具</h2>
    
    <label>1. 目标网站 URL (任意网址)：</label>
    <input type="url" id="targetUrl" placeholder="https://..." value="https://" />
    
    <label>2. App 名称：</label>
    <input type="text" id="appName" placeholder="例如：我的工具" />

    <label>3. 上传 App 图标：</label>
    <input type="file" id="iconFile" accept="image/*" />

    <button onclick="generateApp()">🚀 生成 App 访问链接</button>

    <div id="previewBox" class="preview-box">
        <h3 style="text-align: center; color: #4ade80; margin-top: 0;">配置就绪！</h3>
        <img id="iconPreview" class="app-icon-preview" src="" alt="App Icon" />
        <p style="text-align: center; font-weight: bold;" id="namePreview"></p>
        
        <div class="instruction">
            <p><strong>如何体验和安装：</strong></p>
            <ol>
                <li>点击下方按钮，直接安全跳转到目标网址。</li>
                <li>在手机浏览器菜单（右上角三个点）中，点击 <strong>“添加到主屏幕”</strong>。</li>
                <li>即可在桌面生成独立 App 图标！</li>
            </ol>
        </div>

        <button style="background-color: #16a34a;" onclick="launchApp()">🔗 直接打开目标网址</button>
    </div>
</div>

<script>
    let targetWebsite = "";

    function generateApp() {
        const url = document.getElementById('targetUrl').value.trim();
        const name = document.getElementById('appName').value.trim();
        const fileInput = document.getElementById('iconFile');

        if (!url || url === 'https://') {
            alert('请输入要转换的目标网址！');
            return;
        }
        if (!name) {
            alert('请输入 App 名称！');
            return;
        }

        targetWebsite = url;

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                showPreview(name, e.target.result);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            showPreview(name, 'https://img.icons8.com/color/96/globe--v1.png');
        }
    }

    function showPreview(name, iconBase64) {
        document.getElementById('iconPreview').src = iconBase64;
        document.getElementById('namePreview').innerText = name;
        document.getElementById('previewBox').style.display = 'block';
    }

    function launchApp() {
        if (!targetWebsite) return;
        // 直接安全跳转到目标网页，避免浏览器拦截虚假的 blob 页面
        window.open(targetWebsite, '_blank');
    }
</script>

</body>
</html>
