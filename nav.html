<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --green:#0E5A38; --amber:#F29B00; --red:#C8321E;
  --bg:#EEF1EF; --panel:#FFFFFF; --ink:#101914; --muted:#5B6A62; --line:#D5DCD8;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --green:#157A4C; --bg:#141A17; --panel:#1C2420; --ink:#EAF0EC; --muted:#93A39A; --line:#2E3A34; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#map{position:fixed;inset:0}

/* 导航横幅：仿路牌 */
#banner{position:fixed;left:0;right:0;top:0;z-index:1000;display:none;align-items:center;gap:14px;
  background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
#banner.on{display:flex}
#arrow{font-size:46px;line-height:1;width:56px;text-align:center}
#dist{font-size:30px;font-weight:700;line-height:1.1}
#instr{font-size:16px;margin-top:2px}

/* 底部面板 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);
  border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.22);
  padding:12px 14px calc(env(safe-area-inset-bottom) + 10px);max-height:58vh;overflow:auto}
#status{font-size:13px;color:var(--muted);margin-bottom:8px}
#status:empty{display:none}
.row{display:flex;gap:8px;align-items:stretch}
.row > *{min-height:44px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-size:15px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
button.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
button.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#results{margin-top:8px}
.item{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;min-height:44px}
.item b{display:block;font-weight:600}
.item span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
#saved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.chip button{border:0;border-radius:0;min-height:36px;padding:0 12px}
.chip button + button{padding:0 10px;color:var(--muted)}
#sum{margin-bottom:10px;font-size:15px}
.addr{display:block;font-size:14px;color:var(--muted)}
.warn{color:var(--red);font-size:14px;margin:0 0 10px}
#sum b{display:block;font-size:17px;margin-bottom:2px}
#rem{font-size:15px;margin-bottom:10px}
#credit{font-size:11px;color:var(--muted);margin-top:10px}

/* 地图标记 */
.me{width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.4);position:relative}
.cone{position:absolute;inset:-14px;transform-origin:center}
.cone::before{content:"";position:absolute;left:50%;top:0;margin-left:-6px;border-left:6px solid transparent;
  border-right:6px solid transparent;border-bottom:10px solid var(--green)}
.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--red);border:3px solid #fff;
  transform:rotate(-45deg);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="map"></div>

<div id="banner" role="status" aria-live="polite">
  <div id="arrow">↑</div>
  <div><div id="dist"></div><div id="instr"></div></div>
</div>

<div id="sheet">
  <div id="status" role="status"></div>

  <div id="searchBox">
    <div class="row">
      <input id="q" type="search" placeholder="搜索目的地，或直接点地图" enterkeyhint="search" autocomplete="off">
      <button id="go" class="pri">搜索</button>
      <button class="loc" aria-label="回到我的位置">◎</button>
    </div>
    <div id="results"></div>
    <div id="saved"></div>
  </div>

  <div id="routeBox" hidden>
    <div id="sum"></div>
    <div id="gpsNote" class="warn" hidden>还没有取得你的位置，暂时无法从你这里出发。点 ◎ 重试定位。</div>
    <div class="row" id="rowPlace">
      <button id="goRoute" class="pri">路线</button>
      <button id="testRoute" hidden>测试起点</button>
      <button id="save">收藏</button>
      <button id="clear">取消</button>
    </div>
    <div class="row" id="rowRoute" hidden>
      <button id="start" class="pri">开始导航</button>
      <button id="sim">模拟行驶</button>
      <button id="back">返回</button>
    </div>
  </div>

  <div id="navBox" hidden>
    <div id="rem"></div>
    <div class="row">
      <button id="voice">语音：开</button>
      <button class="loc" aria-label="回到我的位置">◎</button>
      <button id="end" class="danger">结束导航</button>
    </div>
  </div>

  <div id="credit">地图数据 © OpenStreetMap 贡献者，路线 OSRM，地名搜索 Photon、Nominatim（v0.4）</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);

/* ---------- 存储（不可用时退回内存） ---------- */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } }
};

/* ---------- 状态 ---------- */
let me = null, meMarker = null, accCircle = null, destMarker = null, routeLayer = null;
let dest = null, route = null, coords = [], steps = [], stepIdx = 0;
let fallbackFrom = null, geoWatch = null;
let navigating = false, follow = true, voiceOn = true;
let simTimer = null, lastReroute = 0, spoken = {}, wl = null;

/* ---------- 地图 ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([1.3521,103.8198], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
map.on('dragstart', () => { follow = false; });
map.on('click', e => { if(!navigating) setDest(e.latlng.lat, e.latlng.lng, '地图选点', '', false); });

/* ---------- 工具函数 ---------- */
function status(t){ $('#status').textContent = t || ''; }
async function fetchJSON(url){
  let res;
  try{ res = await fetch(url); }catch(e){ throw new Error('网络连接失败'); }
  if(!res.ok) throw new Error('服务器返回异常（HTTP ' + res.status + '）');
  const type = res.headers.get('content-type') || '';
  if(!type.includes('json')) throw new Error('服务器返回的不是有效数据');
  return res.json();
}
function hav(a,b){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const r=x=>x*Math.PI/180, d=x=>x*180/Math.PI;
  const y=Math.sin(r(b[1]-a[1]))*Math.cos(r(b[0]));
  const x=Math.cos(r(a[0]))*Math.sin(r(b[0])) - Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(r(b[1]-a[1]));
  return (d(Math.atan2(y,x))+360)%360;
}
function fmtDist(m){
  if(m < 100) return Math.max(5, Math.round(m/5)*5) + ' 米';
  if(m < 1000) return Math.round(m/10)*10 + ' 米';
  return (m/1000).toFixed(1) + ' 公里';
}
function hhmm(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

function distToRoute(p){
  const k=Math.cos(p.lat*Math.PI/180), R=111320;
  let best=Infinity;
  for(let i=0;i<coords.length-1;i++){
    const ax=(coords[i][1]-p.lng)*k*R,   ay=(coords[i][0]-p.lat)*R;
    const bx=(coords[i+1][1]-p.lng)*k*R, by=(coords[i+1][0]-p.lat)*R;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    const t = len2 ? Math.max(0, Math.min(1, -(ax*dx+ay*dy)/len2)) : 0;
    const d = Math.hypot(ax+t*dx, ay+t*dy);
    if(d<best) best=d;
  }
  return best;
}
function densify(c, step){
  const out=[c[0]];
  for(let i=1;i<c.length;i++){
    const a={lat:c[i-1][0],lng:c[i-1][1]}, b={lat:c[i][0],lng:c[i][1]};
    const n=Math.max(1, Math.round(hav(a,b)/step));
    for(let k=1;k<=n;k++) out.push([a.lat+(b.lat-a.lat)*k/n, a.lng+(b.lng-a.lng)*k/n]);
  }
  return out;
}

/* ---------- 语音与指令文字 ---------- */
function speak(t){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; speechSynthesis.speak(u); }catch(e){}
}
const MOD = {'left':'左转','right':'右转','slight left':'向左前方行驶','slight right':'向右前方行驶',
  'sharp left':'向左后方急转','sharp right':'向右后方急转','straight':'直行','uturn':'掉头'};
function textOf(s){
  const m=s.maneuver, mod=m.modifier, nm=s.name ? '，进入' + s.name : '';
  switch(m.type){
    case 'arrive': return '到达目的地';
    case 'depart': return '出发' + (s.name ? '，沿' + s.name + '行驶' : '');
    case 'roundabout': case 'rotary': case 'roundabout turn':
      return '进入环岛' + (m.exit ? '，第' + m.exit + '个出口驶出' : '');
    case 'exit roundabout': case 'exit rotary': return '驶出环岛' + nm;
    case 'merge': return '并入主路' + nm;
    case 'on ramp': return '驶入匝道' + nm;
    case 'off ramp': return '驶出匝道' + nm;
    case 'fork': return (mod && mod.includes('left') ? '靠左' : '靠右') + '行驶' + nm;
    case 'end of road': return '道路尽头' + (MOD[mod] || '转弯') + nm;
    case 'continue': case 'new name': return '继续' + (MOD[mod] || '直行') + nm;
    default: return (MOD[mod] || '直行') + nm;
  }
}
function arrowOf(s){
  const t=s.maneuver.type, mod=s.maneuver.modifier;
  if(t==='arrive') return '⚑';
  if(t==='roundabout' || t==='rotary') return '⟳';
  return ({'left':'↰','right':'↱','slight left':'↖','slight right':'↗','sharp left':'↲','sharp right':'↳','straight':'↑','uturn':'↩'})[mod] || '↑';
}

/* ---------- 定位 ---------- */
function geoMsg(e){
  if(e.code === 1){
    if(window.top !== window.self) return '此页面在预览窗口里，浏览器禁用了定位。请部署到GitHub Pages，用手机浏览器直接打开';
    return '定位被拒绝。请在浏览器设置里允许本网站使用位置，并确认手机的定位服务已开启';
  }
  if(e.code === 2) return '暂时取不到位置，请到室外空旷处再试';
  if(e.code === 3) return '定位超时，请点 ◎ 重试';
  return e.message || '未知原因';
}
function onFix(p){
  if(simTimer) return;
  onPos({lat:p.coords.latitude, lng:p.coords.longitude, heading:p.coords.heading, speed:p.coords.speed, accuracy:p.coords.accuracy});
}
function startGPS(){
  if(!window.isSecureContext){ status('当前页面不是HTTPS，浏览器会禁用定位。请用GitHub Pages的https网址打开'); return; }
  if(!navigator.geolocation){ status('此浏览器不支持定位'); return; }
  if(geoWatch !== null) return;
  geoWatch = navigator.geolocation.watchPosition(onFix, e => status('定位失败：' + geoMsg(e)),
    {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
function onPos(p){
  const first = !me; me = p; if(first) refreshGpsNote();
  const ll = [p.lat, p.lng];
  if(!meMarker){
    meMarker = L.marker(ll, {icon:L.divIcon({className:'', html:'<div class="me"><div class="cone"></div></div>', iconSize:[22,22], iconAnchor:[11,11]}),
      interactive:false, zIndexOffset:1000}).addTo(map);
  } else meMarker.setLatLng(ll);
  if(p.accuracy){
    if(!accCircle) accCircle = L.circle(ll, {radius:p.accuracy, weight:1, color:'#0E5A38', fillOpacity:.12, interactive:false}).addTo(map);
    else accCircle.setLatLng(ll).setRadius(p.accuracy);
  }
  const cone = meMarker.getElement() && meMarker.getElement().querySelector('.cone');
  if(cone && p.heading != null && !isNaN(p.heading)) cone.style.transform = 'rotate(' + p.heading + 'deg)';
  if((first && !dest) || (navigating && follow)){
    map.setView(ll, navigating ? Math.max(map.getZoom(),16) : Math.max(map.getZoom(),15), {animate:true});
  }
  if(navigating) progress(p);
}
function recenter(){
  follow = true;
  if(me){ map.setView([me.lat, me.lng], Math.max(map.getZoom(),16)); return; }
  if(!window.isSecureContext){ status('当前页面不是HTTPS，浏览器会禁用定位。请用GitHub Pages的https网址打开'); return; }
  if(!navigator.geolocation){ status('此浏览器不支持定位'); return; }
  status('正在定位…');
  navigator.geolocation.getCurrentPosition(onFix, e => status('定位失败：' + geoMsg(e)), {enableHighAccuracy:true, timeout:20000});
  startGPS();
}
document.querySelectorAll('.loc').forEach(b => b.onclick = recenter);

/* ---------- 搜索：我的地点 + Photon（边打字提示） + Nominatim（后备） ---------- */
let searchSeq = 0, searchTimer = null;
function searchBias(){
  if(me) return {lat:me.lat, lng:me.lng};
  const c = map.getCenter(); return {lat:c.lat, lng:c.lng};
}
function mine(q){
  const k = q.toLowerCase();
  return (store.get('saved') || []).filter(p => p.name.toLowerCase().includes(k))
    .map(p => ({name:p.name, addr:'我的地点', lat:p.lat, lng:p.lng}));
}
async function photon(q){
  const b = searchBias();
  const url = 'https://photon.komoot.io/api/?limit=15&lat=' + b.lat + '&lon=' + b.lng + '&q=' + encodeURIComponent(q);
  const j = await fetchJSON(url);
  return (j.features || [])
    .filter(f => ['MY','SG'].includes(String((f.properties || {}).countrycode || '').toUpperCase()))
    .slice(0, 8)
    .map(f => {
      const p = f.properties;
      const street = p.street ? p.street + (p.housenumber ? ' ' + p.housenumber : '') : '';
      const parts = [street, p.district || p.suburb || '', p.city || p.county || '', p.state || ''].filter(Boolean);
      return {name: p.name || parts[0] || q, addr: parts.join('，'), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]};
    });
}
async function nominatim(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=zh,en&countrycodes=my,sg&q=' + encodeURIComponent(q);
  const list = await fetchJSON(url);
  return list.map(r => {
    const parts = r.display_name.split(', ');
    return {name: r.name || parts[0], addr: parts.slice(1,4).join('，'), lat: +r.lat, lng: +r.lon};
  });
}
function renderResults(list){
  const box = $('#results'); box.innerHTML = '';
  const seen = new Set();
  list.forEach(r => {
    const key = r.name + '|' + r.lat.toFixed(3) + '|' + r.lng.toFixed(3);
    if(seen.has(key)) return; seen.add(key);
    const b = document.createElement('button'); b.className = 'item';
    const t = document.createElement('b'); t.textContent = r.name;
    const s = document.createElement('span'); s.textContent = r.addr;
    b.append(t, s); b.onclick = () => pick(r.lat, r.lng, r.name, r.addr);
    box.append(b);
  });
}
async function search(final){
  const q = $('#q').value.trim();
  if(!q){ searchSeq++; $('#results').innerHTML = ''; status(''); return; }
  if(!final && q.length < 2) return;
  const seq = ++searchSeq;
  if(final) status('搜索中…');
  let list = mine(q), src = '';
  try{
    const a = await photon(q);
    if(seq !== searchSeq) return;
    list = list.concat(a); src = 'Photon';
    if(final && !a.length){
      const n = await nominatim(q);
      if(seq !== searchSeq) return;
      list = list.concat(n); src = 'Nominatim';
    }
  }catch(e){
    if(seq !== searchSeq) return;
    if(final){
      try{ list = list.concat(await nominatim(q)); src = 'Nominatim'; }
      catch(e2){ status('搜索失败：' + e2.message); return; }
    }
  }
  if(seq !== searchSeq) return;
  renderResults(list);
  if(!list.length) status(final ? '没有找到。可以直接点地图选点，再按「收藏」加入我的地点' : '');
  else status(final && src ? '结果来源：' + src : '');
}
$('#go').onclick = () => search(true);
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') search(true); });
$('#q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(false), 400); });
function pick(lat,lng,name,addr){ $('#results').innerHTML=''; setDest(lat,lng,name,addr); }

/* ---------- 收藏 ---------- */
function renderSaved(){
  const box = $('#saved'); box.innerHTML = '';
  (store.get('saved') || []).forEach((p,i) => {
    const c = document.createElement('span'); c.className = 'chip';
    const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => pick(p.lat, p.lng, p.name);
    const x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label','删除 ' + p.name);
    x.onclick = () => { const a = store.get('saved') || []; a.splice(i,1); store.set('saved', a); renderSaved(); };
    c.append(b, x); box.append(c);
  });
}
$('#save').onclick = () => {
  if(!dest) return;
  const a = store.get('saved') || [];
  const name = dest.name === '地图选点' ? (prompt('给这个地点起个名字') || '') : dest.name;
  if(!name) return;
  a.push({name, lat:dest.lat, lng:dest.lng}); store.set('saved', a); renderSaved(); status('已收藏：' + name);
};

/* ---------- 路线 ---------- */
function dropRoute(){
  if(routeLayer){ routeLayer.remove(); routeLayer = null; }
  route = null; coords = []; steps = [];
}
function refreshGpsNote(){
  $('#gpsNote').hidden = !!me || !dest || !!route;
  $('#testRoute').hidden = !!me || !!route;
}
function showPlaceCard(){
  $('#sum').innerHTML = '';
  const b = document.createElement('b'); b.textContent = dest.name;
  const a = document.createElement('span'); a.className = 'addr';
  a.textContent = dest.addr || (dest.lat.toFixed(5) + ', ' + dest.lng.toFixed(5));
  $('#sum').append(b, a);
  $('#searchBox').hidden = true; $('#routeBox').hidden = false;
  $('#rowPlace').hidden = false; $('#rowRoute').hidden = true;
  refreshGpsNote();
}
function setDest(lat,lng,name,addr,jump){
  if(jump === undefined) jump = true;
  if(!dest && !me) fallbackFrom = map.getCenter();
  dest = {lat, lng, name, addr: addr || ''};
  const icon = L.divIcon({className:'', html:'<div class="pin"></div>', iconSize:[20,20], iconAnchor:[10,24]});
  if(destMarker) destMarker.setLatLng([lat,lng]); else destMarker = L.marker([lat,lng], {icon, interactive:false}).addTo(map);
  dropRoute();
  if(jump) map.flyTo([lat,lng], Math.max(map.getZoom(), 17), {duration:0.8});
  showPlaceCard();
}
async function doRoute(useFallback){
  status('规划路线中…');
  try{ await getRoute(true, useFallback); }catch(e){ status('路线规划失败：' + e.message); }
}
async function getRoute(fit, useFallback){
  let from;
  if(me && !useFallback) from = [me.lng, me.lat];
  else if(fallbackFrom) from = [fallbackFrom.lng, fallbackFrom.lat];
  else throw new Error('没有起点');
  status(useFallback ? '测试模式：起点不是你的真实位置' : '');
  const url = 'https://router.project-osrm.org/route/v1/driving/' + from[0] + ',' + from[1] + ';' + dest.lng + ',' + dest.lat +
              '?overview=full&geometries=geojson&steps=true';
  const j = await fetchJSON(url);
  if(j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('找不到可行驶的路线（' + (j.code || '无结果') + '）');
  const r = j.routes[0];
  if(!r.geometry || r.geometry.coordinates.length < 3) throw new Error('路线数据不完整，已拒绝使用');
  route = r;
  coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
  steps = route.legs[0].steps;
  const warns = [];
  const straight = hav({lat:from[1], lng:from[0]}, dest);
  if(route.distance > 2000 && route.distance / straight < 1.02) warns.push('这条路线几乎是一条直线，可能不可靠，请勿盲目跟随');
  const wp = j.waypoints || [];
  if(wp[0] && wp[0].distance > 200) warns.push('起点离最近的道路约 ' + Math.round(wp[0].distance) + ' 米');
  if(wp[1] && wp[1].distance > 200) warns.push('目的地离最近的道路约 ' + Math.round(wp[1].distance) + ' 米，可能没有路通到那里');
  stepIdx = 0; spoken = {};
  if(routeLayer) routeLayer.remove();
  routeLayer = L.layerGroup([
    L.polyline(coords, {color:'#5C3A00', weight:11, opacity:.55}),
    L.polyline(coords, {color:'#F29B00', weight:7, opacity:1})
  ]).addTo(map);
  if(fit) map.fitBounds(L.polyline(coords).getBounds(), {paddingTopLeft:[30,30], paddingBottomRight:[30,240]});
  $('#sum').innerHTML = '';
  const b = document.createElement('b'); b.textContent = dest.name;
  const s = document.createElement('span');
  s.textContent = fmtDist(route.distance) + '，约 ' + Math.max(1, Math.round(route.duration/60)) + ' 分钟';
  $('#sum').append(b, s);
  warns.forEach(w => {
    const d = document.createElement('div');
    d.textContent = '注意：' + w; d.style.color = 'var(--red)'; d.style.marginTop = '4px';
    $('#sum').append(d);
  });
  if(!navigating){ $('#searchBox').hidden = true; $('#routeBox').hidden = false; $('#rowPlace').hidden = true; $('#rowRoute').hidden = false; $('#gpsNote').hidden = true; }
}
function clearRoute(){
  endNav(true);
  if(routeLayer){ routeLayer.remove(); routeLayer = null; }
  if(destMarker){ destMarker.remove(); destMarker = null; }
  route = null; dest = null; coords = []; steps = []; fallbackFrom = null;
  $('#routeBox').hidden = true; $('#searchBox').hidden = false; status('');
}
$('#clear').onclick = clearRoute;
$('#goRoute').onclick = () => {
  if(!me){ status('还没有取得你的位置，无法从你这里出发。点 ◎ 重试定位'); return; }
  doRoute(false);
};
$('#testRoute').onclick = () => doRoute(true);
$('#back').onclick = () => { endNav(true); dropRoute(); if(dest) map.flyTo([dest.lat, dest.lng], 17); showPlaceCard(); };

/* ---------- 导航 ---------- */
async function wake(){ try{ wl = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(navigating && document.visibilityState === 'visible') wake(); });

function startNav(){
  if(!route) return;
  navigating = true; follow = true; stepIdx = 0; spoken = {};
  $('#banner').classList.add('on');
  $('#searchBox').hidden = true; $('#routeBox').hidden = true; $('#navBox').hidden = false;
  wake(); speak('开始导航');
  if(me){ map.setView([me.lat, me.lng], 16); progress(me); }
  else showStep(steps[1] || steps[0], route.distance);
}
function endNav(silent){
  navigating = false;
  if(simTimer){ clearInterval(simTimer); simTimer = null; $('#sim').textContent = '模拟行驶'; }
  $('#banner').classList.remove('on'); $('#navBox').hidden = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if(wl){ wl.release(); wl = null; } }catch(e){}
  if(!silent && route){ $('#routeBox').hidden = false; }
}
$('#start').onclick = startNav;
$('#end').onclick = () => endNav(false);
$('#voice').onclick = () => { voiceOn = !voiceOn; $('#voice').textContent = '语音：' + (voiceOn ? '开' : '关'); if(!voiceOn) try{ speechSynthesis.cancel(); }catch(e){} };

function progress(p){
  if(!route) return;
  if(!simTimer && distToRoute(p) > 70 && Date.now() - lastReroute > 12000){ lastReroute = Date.now(); reroute(); return; }
  const thr = Math.max(25, (p.speed || 0) * 2);
  for(let guard = 0; guard < 5; guard++){
    const nx = steps[stepIdx + 1]; if(!nx) return;
    const loc = {lat:nx.maneuver.location[1], lng:nx.maneuver.location[0]};
    const d = hav(p, loc);
    if(d < thr){
      if(stepIdx + 1 >= steps.length - 1){ arrive(); return; }
      stepIdx++; continue;
    }
    showStep(nx, d); return;
  }
}
function showStep(s, d){
  const txt = textOf(s);
  $('#arrow').textContent = arrowOf(s);
  $('#dist').textContent = fmtDist(d);
  $('#instr').textContent = txt;
  const k = stepIdx;
  if(d <= 350 && !spoken[k+'a']){ spoken[k+'a'] = 1; speak('前方' + fmtDist(d) + '，' + txt); }
  if(d <= 60 && !spoken[k+'b']){ spoken[k+'b'] = 1; speak(txt); }
  let rem = d, t = 0;
  for(let j = stepIdx + 1; j < steps.length; j++){ rem += steps[j].distance; t += steps[j].duration; }
  $('#rem').textContent = '剩余 ' + fmtDist(rem) + '，预计 ' + hhmm(new Date(Date.now() + t*1000)) + ' 到达';
}
function arrive(){
  $('#arrow').textContent = '⚑'; $('#dist').textContent = '已到达'; $('#instr').textContent = dest ? dest.name : '';
  speak('已到达目的地');
  setTimeout(() => { if(navigating) endNav(false); }, 5000);
}
async function reroute(){
  status('偏离路线，重新规划…'); speak('已偏离路线，重新规划');
  try{ await getRoute(false); status(''); if(me) progress(me); }
  catch(e){ status('重新规划失败：' + e.message); }
}

/* ---------- 模拟行驶（没有GPS或在桌面测试时用） ---------- */
$('#sim').onclick = () => {
  if(!route) return;
  if(simTimer){ clearInterval(simTimer); simTimer = null; $('#sim').textContent = '模拟行驶'; return; }
  const pts = densify(coords, 12);
  let i = 0;
  if(!navigating) startNav();
  $('#sim').textContent = '停止模拟';
  simTimer = setInterval(() => {
    if(i >= pts.length){ clearInterval(simTimer); simTimer = null; return; }
    const p = pts[i++], prev = pts[Math.max(0, i-2)];
    onPos({lat:p[0], lng:p[1], heading:bearing(prev, p), speed:null});
  }, 500);
};

/* ---------- 启动 ---------- */
renderSaved();
startGPS();
</script>
