<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050A0F">
<title>NAV//TECH v2 - 科技重构版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050A0F; --panel:#0E1A24F2; --panel2:#121F2B; --ink:#C8F8FF; --muted:#6B8E99;
  --cyan:#00F0FF; --cyan2:#00F0FF1A; --cyan-glow:0 0 12px #00F0FF55,0 0 24px #00F0FF22;
  --mag:#FF2A6D; --amber:#FFB800; --line:#1B3240; --line2:#234556;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;overflow:hidden}
#map{position:fixed;inset:0;filter:contrast(1.15) brightness(0.9) saturate(1.2)}
#map::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:400;background:
  linear-gradient(90deg, transparent 96%, rgba(0,240,255,.06) 100%),
  linear-gradient(transparent 96%, rgba(0,240,255,.06) 100%);background-size:40px 40px;opacity:.5}
#map::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:401;background:radial-gradient(130% 100% at 50% 0%, transparent 60%, rgba(0,0,0,.7) 100%)}

/* HUD top */
#topHud{position:fixed;top:0;left:0;right:0;z-index:1001;display:flex;gap:14px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;
  background:linear-gradient(180deg, rgba(5,10,15,.95) 0%, rgba(5,10,15,.6) 60%, transparent 100%);
  font-size:10px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid #00F0FF11}
#topHud b{color:var(--cyan);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:var(--cyan-glow);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#sysClock{margin-left:auto;color:var(--cyan);font-weight:700}

/* Banner HUD */
#banner{position:fixed;left:12px;right:12px;top:52px;z-index:1000;display:none;gap:14px;align-items:center;
  background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--cyan);
  box-shadow:var(--cyan-glow);padding:14px 16px;clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))}
#banner.on{display:flex}
#arrow{width:58px;height:58px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan2),transparent);border:1px solid var(--cyan);color:var(--cyan);font-size:30px;box-shadow:inset 0 0 12px var(--cyan2)}
#dist{font-size:28px;font-weight:700;color:var(--cyan);letter-spacing:.02em;line-height:1}
#instr{font-size:13px;margin-top:4px;color:#E6FFFF;letter-spacing:.02em}

/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);backdrop-filter:blur(22px) saturate(1.3);
  border-top:1px solid var(--cyan);box-shadow:0 -8px 40px rgba(0,240,255,.18), inset 0 1px 0 rgba(0,240,255,.2);
  padding:14px 12px calc(env(safe-area-inset-bottom) + 12px);max-height:68vh;overflow:auto;scrollbar-width:thin}
#sheet::-webkit-scrollbar{width:4px}#sheet::-webkit-scrollbar-thumb{background:var(--line2)}
#status{font-size:11px;color:var(--amber);margin-bottom:8px;letter-spacing:.08em;min-height:14px}
#status:empty{display:none}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-height:44px}
input{flex:1;min-width:0;font:inherit;font-size:14px;padding:0 12px;border-radius:3px;border:1px solid var(--line);background:#02070A;color:var(--ink);letter-spacing:.02em}
input::placeholder{color:var(--muted);font-size:11px;letter-spacing:.12em}
input:focus{outline:none;border-color:var(--cyan);box-shadow:var(--cyan-glow)}
button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 12px;border-radius:3px;border:1px solid var(--line2);background:rgba(255,255,255,.02);color:var(--ink);cursor:pointer;transition:.15s}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button.pri{background:var(--cyan);border-color:var(--cyan);color:#020A0F;font-weight:700;box-shadow:var(--cyan-glow)}
button.pri:hover{filter:brightness(1.15)}
button.danger{border-color:var(--mag);color:var(--mag)}button.danger:hover{background:var(--mag);color:#fff}
#filterChips{display:flex;gap:6px;margin:12px 0 6px;overflow:auto;padding-bottom:2px}
.fchip{font-size:10px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;cursor:pointer;color:var(--muted);letter-spacing:.08em;transition:.15s}
.fchip.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan2);box-shadow:var(--cyan-glow)}
#results{margin-top:8px;display:grid;gap:8px}
.item{position:relative;text-align:left;padding:12px 12px 10px;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:.18s}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan);opacity:0;transition:.18s}
.item:hover{border-color:var(--cyan);background:rgba(0,240,255,.07);transform:translateY(-1px);box-shadow:var(--cyan-glow)}
.item:hover::before{opacity:1}
.item b{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;color:#E6FFFF}
.item b i{font-style:normal;font-size:14px;filter:drop-shadow(0 0 6px var(--cyan2))}
.item .addr{font-size:11px;color:var(--muted);margin-top:5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta span{font-size:9px;padding:3px 7px;border-radius:3px;background:rgba(0,240,255,.08);border:1px solid #1E3A4A;color:var(--muted);letter-spacing:.06em}
.meta span.hl{color:var(--cyan);border-color:var(--cyan);background:var(--cyan2)}

#placeCard{position:relative;background:linear-gradient(180deg, rgba(0,240,255,.09), rgba(0,240,255,.03));border:1px solid var(--cyan);border-radius:6px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--cyan-glow)}
#placeCard::after{content:"DETAILED_SCAN";position:absolute;right:10px;top:8px;font-size:8px;letter-spacing:.2em;color:var(--cyan);opacity:.5}
#placeCard b{font-size:15px;color:var(--cyan);display:block;letter-spacing:.02em}
#placeCard .line{font-size:11px;color:var(--muted);margin-top:5px;word-break:break-all;line-height:1.4}
#placeCard .line.coord{color:var(--cyan);font-family:monospace;cursor:pointer}
.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:9px;padding:4px 8px;border:1px solid var(--line2);border-radius:3px;color:var(--muted);background:rgba(0,0,0,.2);letter-spacing:.06em}

#saved{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:rgba(0,240,255,.06)}
.chip button{border:0;min-height:32px;font-size:10px;padding:0 10px}

.me{width:20px;height:20px;border-radius:50%;background:var(--cyan);border:2px solid #fff;box-shadow:0 0 0 6px var(--cyan2), var(--cyan-glow);position:relative}
.me::after{content:"";position:absolute;inset:-20px;border:1px solid var(--cyan);border-radius:50%;animation:ping 1.8s infinite}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.9);opacity:0}}
.pin{width:18px;height:24px;background:var(--mag);clip-path:polygon(50% 0,100% 28%,100% 75%,50% 100%,0 75%,0 28%);border:1px solid #fff;box-shadow:0 0 12px var(--mag)}

#credit{font-size:8px;color:var(--muted);margin-top:14px;letter-spacing:.14em;opacity:.6}
</style>
</head>
<body>
<div id="map"></div>
<div id="topHud">
  <div class="dot"></div>
  <div>SYS:<b>ONLINE</b> | GPS:<b id="gpsAcc">--</b> | SPD:<b id="gpsSpd">--</b> | HDG:<b id="gpsHdg">--</b></div>
  <div id="sysClock">--:--:--</div>
</div>
<div id="banner" role="status"><div id="arrow">↑</div><div><div id="dist"></div><div id="instr"></div></div></div>
<div id="sheet">
  <div id="status"></div>
  <div id="searchBox">
    <div class="row">
      <input id="q" type="search" placeholder="SEARCH // 搜索目的地，或点地图选点" autocomplete="off" enterkeyhint="search">
      <button id="go" class="pri">SCAN</button>
      <button class="loc">◎ LOC</button>
    </div>
    <div id="filterChips">
      <div class="fchip on" data-f="all">ALL</div>
      <div class="fchip" data-f="food">餐饮 FOOD</div>
      <div class="fchip" data-f="fuel">加油 FUEL</div>
      <div class="fchip" data-f="parking">停车 PARK</div>
      <div class="fchip" data-f="medical">医疗 MED</div>
    </div>
    <div id="results"></div>
    <div id="saved"></div>
  </div>
  <div id="routeBox" hidden>
    <div id="placeCard" hidden></div>
    <div id="sum"></div>
    <div id="gpsNote" hidden style="font-size:11px;color:var(--amber);margin:8px 0">NO_GPS_FIX // 点击 ◎ 重试定位</div>
    <div class="row" id="rowPlace">
      <button id="goRoute" class="pri">▶ ROUTE</button>
      <button id="testRoute" hidden>TEST_ORIGIN</button>
      <button id="save">★ SAVE</button>
      <button id="clear">✕ CANCEL</button>
    </div>
    <div class="row" id="rowRoute" hidden>
      <button id="start" class="pri">▶ START_NAV</button>
      <button id="sim">SIMULATE</button>
      <button id="back">◀ BACK</button>
    </div>
  </div>
  <div id="navBox" hidden>
    <div id="rem" style="font-size:11px;margin-bottom:10px;letter-spacing:.06em"></div>
    <div class="row">
      <button id="voice">VOICE:ON</button>
      <button class="loc">◎ LOC</button>
      <button id="end" class="danger">■ END</button>
    </div>
  </div>
  <div id="credit">MAP © CARTODB DARK // OSM © // OSRM // PHOTON+NOMINATIM EXTRATAGS // OVERPASS NEARBY // v2.0_TECH // SINGAPORE 1.3521,103.8198</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const mem={};const store={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let me=null,meMarker=null,accCircle=null,destMarker=null,routeLayer=null,dest=null,route=null,coords=[],steps=[],stepIdx=0,fallbackFrom=null,geoWatch=null,navigating=false,follow=true,voiceOn=true,simTimer=null,lastReroute=0,spoken={},wl=null,currentFilter='all',destObj=null;
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([1.3521,103.8198],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',maxNativeZoom:19}).addTo(map);
map.on('dragstart',()=>{follow=false;});
function status(t){$('#status').textContent=t||'';}
function fmtDist(m){if(m<1000)return Math.round(m)+' m';return (m/1000).toFixed(m<10000?1:0)+' km';}
function hav(a,b){const R=6371000,toRad=x=>x*Math.PI/180;const dLat=toRad(b.lat-a.lat),dLon=toRad(b.lng-a.lng),lat1=toRad(a.lat),lat2=toRad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return R*2*Math.asin(Math.sqrt(h));}
function bearing(a,b){const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;const y=Math.sin(toRad(b[1]-a[0]))*Math.cos(toRad(b[0]));const x=Math.cos(toRad(a[1]))*Math.sin(toRad(b[0]))-Math.sin(toRad(a[1]))*Math.cos(toRad(b[0]))*Math.cos(toRad(b[1]-a[0]));return (toDeg(Math.atan2(y,x))+360)%360;}
function densify(cs,step){const out=[];for(let i=0;i<cs.length-1;i++){const a=cs[i],b=cs[i+1];const d=hav({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]});const n=Math.max(1,Math.round(d/step));for(let k=0;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}out.push(cs[cs.length-1]);return out;}
function hhmm(d){return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});}
function fetchJSON(u){return fetch(u).then(r=>{if(!r.ok) throw new Error('HTTP '+r.status);return r.json();});}
function renderMe(p){if(!meMarker){const icon=L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20],iconAnchor:[10,10]});meMarker=L.marker([p.lat,p.lng],{icon}).addTo(map);accCircle=L.circle([p.lat,p.lng],{radius:p.acc||30,color:'#00F0FF',fillColor:'#00F0FF',fillOpacity:.08,weight:1}).addTo(map);}else{meMarker.setLatLng([p.lat,p.lng]);if(accCircle){accCircle.setLatLng([p.lat,p.lng]);accCircle.setRadius(p.acc||30);}}if(follow) map.setView([p.lat,p.lng],navigating?17:map.getZoom());$('#gpsAcc').textContent=p.acc?Math.round(p.acc)+'m':'--';$('#gpsSpd').textContent=p.speed?(p.speed*3.6).toFixed(0)+' km/h':'--';$('#gpsHdg').textContent=p.heading?Math.round(p.heading)+'°':'--';}
function onPos(p){me=p;renderMe(p);if(navigating) progress(p);}
function startGPS(){if(!navigator.geolocation){status('NO_GEOLOCATION');return;}geoWatch=navigator.geolocation.watchPosition(pos=>{const c=pos.coords;onPos({lat:c.latitude,lng:c.longitude,acc:c.accuracy,heading:c.heading,speed:c.speed});if(!fallbackFrom){fallbackFrom={lat:c.latitude,lng:c.longitude};$('#testRoute').hidden=false;} $('#gpsNote').hidden=true;},err=>{status('GPS_ERROR: '+err.message);},{enableHighAccuracy:true,maximumAge:2000,timeout:12000});}
document.querySelectorAll('.loc').forEach(b=> b.onclick=()=>{follow=true;if(me) map.flyTo([me.lat,me.lng],17);else startGPS();});
setInterval(()=>{$('#sysClock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});},1000);

function catIcon(props){const s=JSON.stringify(props).toLowerCase();if(s.includes('restaurant')||s.includes('cafe')||s.includes('food')||s.includes('cuisine')) return '🍜';if(s.includes('fuel')||s.includes('gas')) return '⛽';if(s.includes('parking')) return '🅿️';if(s.includes('hospital')||s.includes('clinic')||s.includes('pharmacy')) return '🏥';if(s.includes('hotel')) return '🏨';if(s.includes('shop')) return '🛒';if(s.includes('bank')||s.includes('atm')) return '🏦';return '📍';}
function matchesFilter(item,f){if(f==='all') return true;const str=JSON.stringify(item).toLowerCase();if(f==='food') return str.includes('restaurant')||str.includes('cafe')||str.includes('food')||str.includes('amenity')||str.includes('bar');if(f==='fuel') return str.includes('fuel')||str.includes('gas_station');if(f==='parking') return str.includes('parking');if(f==='medical') return str.includes('hospital')||str.includes('clinic')||str.includes('pharmacy')||str.includes('doctors');return true;}

async function doSearch(q){
  if(!q) return;
  status('◍ SCANNING SATELLITE // QUERY:'+q);
  $('#results').innerHTML='<div style="font-size:10px;color:var(--muted);letter-spacing:.1em;padding:8px">▮▮▮ SCANNING_OSM_NETWORK...</div>';
  try{
    const center=me?`&lat=${me.lat}&lon=${me.lng}`:'';
    const url1=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=20&lang=en${center}`;
    const url2=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=20&addressdetails=1&extratags=1&namedetails=1`;
    const [pData,nData]=await Promise.all([fetchJSON(url1).catch(()=>({features:[]})),fetchJSON(url2).catch(()=>[])]);
    let results=[];
    (pData.features||[]).forEach(f=>{const props=f.properties||{};results.push({name:props.name||props.street||props.city||q,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],addr:[props.street,props.housenumber,props.city,props.state,props.country].filter(Boolean).join(', ')||props.osm_value||'',props:props,source:'PHOTON',extratags:props.extratags||{},osm_id:props.osm_id});});
    (nData||[]).forEach(n=>{results.push({name:n.namedetails?.name||n.display_name.split(',')[0]||n.name||q,lat:parseFloat(n.lat),lng:parseFloat(n.lon),addr:n.display_name,props:n,source:'NOMINATIM',extratags:n.extratags||{},address:n.address||{},osm_id:n.osm_id});});
    const dedup=[];results.forEach(r=>{if(!dedup.some(d=> hav(d,r)<60)) dedup.push(r);});
    let filtered=dedup.filter(r=> matchesFilter(r,currentFilter));if(filtered.length===0 && dedup.length>0) filtered=dedup;
    // sort by distance if we have fix
    if(me) filtered.sort((a,b)=> hav(me,a)-hav(me,b));
    renderResults(filtered,q);
    status(`◍ SIGNAL LOCKED // FOUND ${filtered.length} TARGETS // FILTER:${currentFilter.toUpperCase()} // ${q}`);
  }catch(e){status('◍ SCAN FAIL: '+e.message);}
}
function renderResults(list,q){
  const cont=$('#results');cont.innerHTML='';
  if(!list.length){cont.innerHTML='<div style="font-size:10px;color:var(--muted);padding:10px;border:1px dashed var(--line)">NO_SIGNAL // TRY SHORTER KEYWORD // e.g. "Orchard" "MRT" "Kopitiam"</div>';return;}
  list.forEach(r=>{
    const div=document.createElement('button');div.className='item';
    const dist=me?fmtDist(hav(me,r)):'';
    const icon=catIcon(r.props);const extra=r.extratags||{};
    const pills=[];if(extra.opening_hours) pills.push('🕒 '+extra.opening_hours.slice(0,22));if(extra.cuisine) pills.push('🍽 '+extra.cuisine);if(extra.phone) pills.push('☎ '+extra.phone.slice(0,14));if(extra.brand) pills.push(extra.brand);if(dist) pills.push('📡 '+dist);
    const addrShort=r.addr.length>80?r.addr.slice(0,80)+'…':r.addr;
    div.innerHTML=`<b><i>${icon}</i> ${r.name}</b><span class="addr">${addrShort}</span><div class="meta">${pills.map(p=>`<span>${p}</span>`).join('')}<span class="hl">${r.source}</span><span class="hl">ID:${r.osm_id||'--'}</span></div>`;
    div.onclick=()=>{pickPlace(r);};
    cont.appendChild(div);
  });
}
function buildPlaceCard(r){
  const card=$('#placeCard');const extra=r.extratags||{};const addr=r.address||{};
  const tags=[];
  if(extra.opening_hours) tags.push('营业: '+extra.opening_hours);
  if(extra.cuisine) tags.push('菜系: '+extra.cuisine);
  if(extra.phone) tags.push('电话: '+extra.phone);
  if(extra.website) tags.push('官网: '+extra.website);
  if(extra.wikipedia) tags.push('Wiki: '+extra.wikipedia);
  if(extra['addr:postcode']||addr.postcode) tags.push('邮编: '+(extra['addr:postcode']||addr.postcode));
  if(addr.suburb) tags.push('街区: '+addr.suburb);
  if(addr.road) tags.push('道路: '+addr.road);
  if(extra.capacity) tags.push('容量: '+extra.capacity);
  card.innerHTML=`<b>${r.name}</b>
    <div class="line">${r.addr}</div>
    <div class="line coord" title="点击复制坐标">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)} // OSM_ID:${r.osm_id||r.props.osm_id||'--'} // 点击复制</div>
    <div class="tagRow">${tags.length?tags.map(t=>`<span class="tag">${t}</span>`).join(''):'<span class="tag" style="color:var(--muted)">NO_EXTRATAGS // 此地点在 OSM 上信息较少</span>'}</div>
    <div style="margin-top:10px;display:flex;gap:6px">
      <button class="pri" style="min-height:32px;font-size:10px" onclick="window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${r.lat},${r.lng}','_blank')">街景 STREET</button>
      <button style="min-height:32px;font-size:10px" onclick="navigator.clipboard.writeText('${r.lat},${r.lng}').then(()=>{document.getElementById('status').textContent='COORD_COPIED';})">复制坐标</button>
    </div>`;
  card.hidden=false;
}
function pickPlace(r){
  destObj=r;dest={lat:r.lat,lng:r.lng,name:r.name,addr:r.addr};
  if(destMarker) destMarker.remove();
  const icon=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[18,24],iconAnchor:[9,24]});
  destMarker=L.marker([r.lat,r.lng],{icon}).addTo(map);
  map.flyTo([r.lat,r.lng],17);
  buildPlaceCard(r);showPlaceCard();fetchNearby(r);
}
async function fetchNearby(r){
  try{
    const q=`[out:json][timeout:12];(node(around:250,${r.lat},${r.lng})[name];way(around:250,${r.lat},${r.lng})[name];);out 6;`;
    const data=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q}).then(x=>x.json()).catch(()=>null);
    if(data&&data.elements){
      const sum=$('#sum');
      const near=data.elements.filter(e=>e.tags&&e.tags.name&&e.id!=r.osm_id).slice(0,4).map(e=>e.tags.name).join(' • ');
      if(near){const d=document.createElement('div');d.className='line';d.style.marginTop='8px';d.style.color='var(--cyan)';d.textContent='NEARBY_SCAN: '+near;sum.appendChild(d);}
    }
  }catch(e){}
}
function showPlaceCard(){
  $('#searchBox').hidden=true;$('#routeBox').hidden=false;$('#rowPlace').hidden=false;$('#rowRoute').hidden=true;$('#gpsNote').hidden=!me;
  const s=$('#sum');if(destObj){s.innerHTML=`<b style="color:var(--cyan)">${destObj.name}</b><span class="addr">${destObj.addr}</span><span class="addr" style="color:var(--cyan)">${destObj.lat.toFixed(6)}, ${destObj.lng.toFixed(6)}</span>`;}
}
async function getRoute(fit,useFallback){
  let from;if(me&&!useFallback) from=[me.lng,me.lat];else if(fallbackFrom) from=[fallbackFrom.lng,fallbackFrom.lat];else throw new Error('NO_ORIGIN');
  status('◍ CALCULATING VECTOR...');
  const url='https://router.project-osrm.org/route/v1/driving/'+from[0]+','+from[1]+';'+dest.lng+','+dest.lat+'?overview=full&geometries=geojson&steps=true';
  const j=await fetchJSON(url);
  if(j.code!=='Ok'||!j.routes||!j.routes.length) throw new Error('NO_ROUTE // '+ (j.code||''));
  const r=j.routes[0];route=r;coords=r.geometry.coordinates.map(c=>[c[1],c[0]]);steps=r.legs[0].steps;stepIdx=0;spoken={};
  if(routeLayer) routeLayer.remove();
  routeLayer=L.layerGroup([
    L.polyline(coords,{color:'#00F0FF',weight:14,opacity:.18}),
    L.polyline(coords,{color:'#00F0FF',weight:3,opacity:1,dashArray:'8 12',lineCap:'round'}),
    L.polyline(coords,{color:'#FFFFFF',weight:1,opacity:.6,dashArray:'1 18'})
  ]).addTo(map);
  if(fit) map.fitBounds(L.polyline(coords).getBounds(),{paddingTopLeft:[30,30],paddingBottomRight:[30,300]});
  const b=document.createElement('b');b.textContent=dest.name;b.style.color='var(--cyan)';
  const s=document.createElement('span');s.className='line';s.textContent=fmtDist(route.distance)+' // '+Math.max(1,Math.round(route.duration/60))+' MIN // '+route.legs[0].steps.length+' STEPS';
  $('#sum').innerHTML='';$('#sum').append(b,s);
  status('◍ ROUTE LOCKED // '+fmtDist(route.distance));
  if(!navigating){$('#searchBox').hidden=true;$('#routeBox').hidden=false;$('#rowPlace').hidden=true;$('#rowRoute').hidden=false;$('#gpsNote').hidden=true;}
}
function dropRoute(){if(routeLayer){routeLayer.remove();routeLayer=null;}}
function clearRoute(){
  if(simTimer){clearInterval(simTimer);simTimer=null;$('#sim').textContent='SIMULATE';}
  $('#banner').classList.remove('on');$('#navBox').hidden=true;
  if(routeLayer){routeLayer.remove();routeLayer=null;}
  if(destMarker){destMarker.remove();destMarker=null;}
  route=null;dest=null;destObj=null;coords=[];steps=[];
  $('#routeBox').hidden=true;$('#searchBox').hidden=false;$('#placeCard').hidden=true;status('◍ STANDBY');
}
$('#clear').onclick=clearRoute;
$('#goRoute').onclick=()=>{if(!me){status('NO_FIX // 需要 GPS 定位');return;}status('◍ ROUTING...');getRoute(true,false).catch(e=>status(e.message));};
$('#testRoute').onclick=()=>{status('◍ TEST_MODE // SIM_ORIGIN');getRoute(true,true).catch(e=>status(e.message));};
$('#back').onclick=()=>{if(simTimer){clearInterval(simTimer);simTimer=null;}$('#banner').classList.remove('on');$('#navBox').hidden=true;dropRoute();if(dest) map.flyTo([dest.lat,dest.lng],17);showPlaceCard();};

function startNav(){if(!route) return;navigating=true;follow=true;stepIdx=0;spoken={};$('#banner').classList.add('on');$('#searchBox').hidden=true;$('#routeBox').hidden=true;$('#navBox').hidden=false;speak('开始导航');if(me) map.setView([me.lat,me.lng],17);if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});}
function endNav(silent){navigating=false;if(simTimer){clearInterval(simTimer);simTimer=null;$('#sim').textContent='SIMULATE';}$('#banner').classList.remove('on');$('#navBox').hidden=true;try{speechSynthesis.cancel();}catch(e){}if(!silent&&route){$('#routeBox').hidden=false;}}
$('#start').onclick=startNav;$('#end').onclick=()=>endNav(false);
$('#voice').onclick=()=>{voiceOn=!voiceOn;$('#voice').textContent='VOICE:'+(voiceOn?'ON':'OFF');if(!voiceOn) try{speechSynthesis.cancel();}catch(e){}};

function arrowOf(s){const m=(s.maneuver||{}).modifier||'';if(m.includes('left')) return '↰';if(m.includes('right')) return '↱';if(m.includes('uturn')) return '↩';return '↑';}
function textOf(s){return s.name?s.name:(s.maneuver?.instruction||'继续直行');}
function showStep(s,d){
  $('#arrow').textContent=arrowOf(s);$('#dist').textContent=fmtDist(d);$('#instr').textContent=textOf(s);
  let rem=d,t=0;for(let j=stepIdx+1;j<steps.length;j++){rem+=steps[j].distance;t+=steps[j].duration;}
  $('#rem').textContent='剩余 '+fmtDist(rem)+' // ETA '+hhmm(new Date(Date.now()+t*1000))+' // NEXT: '+textOf(steps[stepIdx+1]||s);
}
function progress(p){
  if(!route) return;
  const thr=Math.max(25,(p.speed||0)*2);
  for(let g=0;g<5;g++){
    const nx=steps[stepIdx+1];if(!nx) return;
    const loc={lat:nx.maneuver.location[1],lng:nx.maneuver.location[0]};const d=hav(p,loc);
    if(d<thr){if(stepIdx+1>=steps.length-1){arrive();return;}stepIdx++;continue;}
    showStep(nx,d);return;
  }
}
function arrive(){$('#arrow').textContent='⚑';$('#dist').textContent='ARRIVED';$('#instr').textContent=dest?dest.name:'';speak('已到达目的地');setTimeout(()=>{if(navigating) endNav(false);},5000);}
function speak(t){if(!voiceOn) return;try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';speechSynthesis.speak(u);}catch(e){}}

$('#sim').onclick=()=>{
  if(!route) return;
  if(simTimer){clearInterval(simTimer);simTimer=null;$('#sim').textContent='SIMULATE';return;}
  const pts=densify(coords,10);let i=0;if(!navigating) startNav();$('#sim').textContent='STOP_SIM';
  simTimer=setInterval(()=>{if(i>=pts.length){clearInterval(simTimer);simTimer=null;$('#sim').textContent='SIMULATE';return;}const p=pts[i++],prev=pts[Math.max(0,i-2)];onPos({lat:p[0],lng:p[1],heading:bearing(prev,p),speed:8});},350);
};

map.on('click',async(e)=>{
  const {lat,lng}=e.latlng;status('◍ REVERSE_GEOCODING...');
  try{
    const j=await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1&extratags=1&namedetails=1`);
    const name=j.namedetails?.name||j.display_name.split(',')[0]||`${lat.toFixed(5)},${lng.toFixed(5)}`;
    pickPlace({name,lat,lng,addr:j.display_name,props:j,extratags:j.extratags||{},address:j.address||{},osm_id:j.osm_id});
  }catch(err){pickPlace({name:`${lat.toFixed(5)},${lng.toFixed(5)}`,lat,lng,addr:'',props:{},extratags:{}});}
});

$('#go').onclick=()=>doSearch($('#q').value.trim());
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter') doSearch($('#q').value.trim());});
document.querySelectorAll('.fchip').forEach(c=> c.onclick=()=>{document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));c.classList.add('on');currentFilter=c.dataset.f;const q=$('#q').value.trim();if(q) doSearch(q);});

function renderSaved(){
  const arr=store.get('saved')||[];const cont=$('#saved');cont.innerHTML='';
  arr.forEach((it,i)=>{
    const chip=document.createElement('div');chip.className='chip';
    const b1=document.createElement('button');b1.textContent=it.name;b1.onclick=()=>{pickPlace({name:it.name,lat:it.lat,lng:it.lng,addr:it.addr||'',props:{},extratags:{}});};
    const b2=document.createElement('button');b2.textContent='×';b2.onclick=()=>{arr.splice(i,1);store.set('saved',arr);renderSaved();};
    chip.append(b1,b2);cont.appendChild(chip);
  });
}
$('#save').onclick=()=>{if(!dest) return;const arr=store.get('saved')||[];arr.unshift({name:dest.name,lat:dest.lat,lng:dest.lng,addr:dest.addr||''});store.set('saved',arr.slice(0,20));renderSaved();status('◍ SAVED // '+dest.name);};
renderSaved();startGPS();
status('◍ SYSTEM READY // TECH_OS v2.0 // AWAITING INPUT');
</script>
</body>
</html>
