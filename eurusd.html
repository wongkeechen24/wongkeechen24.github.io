<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EURUSD 开盘前参考 / Pre-open Reference</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--accent:#16476a;--up:#1f7a4d;--down:#b3261e;--warn:#a76400}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf3;--mute:#92a3b3;--line:#2b3946;--accent:#7ab6e0;--up:#6fd3a0;--down:#ff8a80;--warn:#f0b95a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.meta{font-size:13px;color:var(--mute)}
.lang button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:14px;display:grid;gap:14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:16px;margin:0 0 4px}
.sub{font-size:13px;color:var(--mute);margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px}
.card .cur{font-size:13px;color:var(--mute)}
.card .big{font-size:24px;font-weight:800;margin:2px 0}
.hawk{color:var(--down)}.dove{color:var(--up)}.neut{color:var(--mute)}
.rows{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;color:var(--mute)}
.rows b{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rel{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--mute);font-weight:600;font-size:13px}
td small{display:block;color:var(--mute);font-size:12px}
.links a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--accent);text-decoration:none}
.links a span{display:block;color:var(--mute);font-size:13px}
.links h3{font-size:13px;color:var(--mute);margin:12px 0 0;font-weight:600}
.axis{fill:var(--mute);font-size:9px}
.grid{stroke:var(--line);stroke-width:.5}
.zero{stroke:var(--mute);stroke-width:.8}
.chg{stroke:var(--warn);stroke-width:.8;stroke-dasharray:2 2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:6px}
.legend b{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawln 2.4s ease-out forwards}
@keyframes drawln{to{stroke-dashoffset:0}}
.pt{opacity:0;animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:1}}
.vl{fill:var(--mute);font-size:10px;font-weight:600}
.vl.last{fill:var(--ink);font-size:13px;font-weight:800}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.d7sum{font-size:14px;margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.pt{animation:none;opacity:1}}
.today{padding:10px 12px;border-radius:8px;background:var(--bg);margin-bottom:12px;font-size:15px}
.today.hot{border:2px solid var(--warn)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ev .tm{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .nm b{font-weight:600}
.ev small{display:block;color:var(--mute);font-size:12px}
.ev.past{opacity:.55}
.ev.now .tm{color:var(--warn);font-weight:700}
.imp{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;border:1px solid var(--line);margin-left:6px}
.imp.High{border-color:var(--down);color:var(--down)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--warn);color:var(--warn)}
@media(max-width:420px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1 data-i="title"></h1><div class="meta" id="meta"></div></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="zh" aria-pressed="true">中文</button><button data-lang="en" aria-pressed="false">English</button>
  </div>
</header>
<main>

<section>
  <h2 data-i="s1"></h2><p class="sub" data-i="s1sub"></p>
  <div class="two">
    <div class="card"><div class="cur">USD · Fed</div><div class="big" id="bUSD"></div><div class="rows" id="dUSD"></div></div>
    <div class="card"><div class="cur">EUR · ECB</div><div class="big" id="bEUR"></div><div class="rows" id="dEUR"></div></div>
  </div>
  <div class="rel" id="rel"></div>
  <h3 style="font-size:14px;margin:16px 0 4px" data-i="chartH"></h3>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="chartNote"></p>
  <h3 style="font-size:14px;margin:18px 0 4px" data-i="d7H"></h3>
  <div class="seg" id="seg7"></div>
  <div class="d7sum" id="d7sum"></div>
  <div id="d7"></div>
  <p class="note" data-i="d7note"></p>
  <p class="note" data-i="s1note"></p>
</section>

<section>
  <h2 data-i="s2"></h2><p class="sub" data-i="s2sub"></p>
  <div class="today" id="today"></div>
  <div id="cal"></div>
  <p class="note" id="calNote"></p>
  <table>
    <thead><tr><th></th><th>USD</th><th>EUR</th></tr></thead>
    <tbody id="macro"></tbody>
  </table>
  <p class="note" id="macroNote"></p>
</section>

<section class="links">
  <h2 data-i="s3"></h2><p class="sub" data-i="s3sub"></p>
  <h3 data-i="gCal"></h3>
  <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Forex Factory<span data-i="l1"></span></a>
  <a href="https://www.fxstreet.com/economic-calendar" target="_blank" rel="noopener">FXStreet<span data-i="l2"></span></a>
  <h3 data-i="gNews"></h3>
  <a href="https://www.fxstreet.com/news" target="_blank" rel="noopener">FXStreet News<span data-i="l3"></span></a>
  <a href="https://www.reuters.com/markets/currencies/" target="_blank" rel="noopener">Reuters<span data-i="l4"></span></a>
  <h3 data-i="gOff"></h3>
  <a href="https://www.federalreserve.gov/newsevents/pressreleases.htm" target="_blank" rel="noopener">Federal Reserve<span data-i="l5"></span></a>
  <a href="https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm" target="_blank" rel="noopener">FOMC<span data-i="l6"></span></a>
  <a href="https://www.ecb.europa.eu/press/pr/html/index.en.html" target="_blank" rel="noopener">ECB<span data-i="l7"></span></a>
  <a href="https://www.bls.gov/schedule/news_release/" target="_blank" rel="noopener">BLS<span data-i="l8"></span></a>
  <a href="https://ec.europa.eu/eurostat/news/release-calendar" target="_blank" rel="noopener">Eurostat<span data-i="l9"></span></a>
</section>

<section>
  <h2 data-i="s4"></h2><p class="sub" id="cotSub"></p>
  <div class="two" id="cot"></div>
  <p class="note" data-i="s4note"></p>
</section>

</main>
<script>
const T={

 rel:{"USD more hawkish than EUR":"美元比欧元更偏鹰","USD more dovish than EUR":"美元比欧元更偏鸽","about balanced":"美元和欧元大致持平"},relH:"相对：",

 chartH:"90-day trend (bp)",chUSD:"USD",chEUR:"EUR",chGap:"Gap (USD − EUR)",chChg:"Rate change",chUp:"Line up = rate expectations more hawkish. Gap up = USD relatively more hawkish. One point per trading day.",

};
let lang="zh",D=null,ERR=false;
try{lang=localStorage.getItem("lang")||"zh"}catch(e){}
const $=id=>document.getElementById(id), t=k=>T[lang][k];
const sg=x=>(x>0?"+":"")+x;
const f=(v,s)=>(v===null||v===undefined)?"—":v+(s||"");

const ZH=[["non-farm","非农就业"],["unemployment rate","失业率"],["core cpi","核心 CPI"],["cpi","CPI"],["core pce","核心 PCE"],["pce","PCE"],["fomc","FOMC"],["federal funds rate","联邦基金利率"],["main refinancing","欧洲央行利率决议"],["deposit facility","欧洲央行利率决议"],["ecb press","欧洲央行记者会"],["gdp","GDP"],["retail sales","零售销售"],["pmi","PMI"],["ppi","PPI"],["jobless claims","初请失业金"],["ism","ISM"],["employment change","就业变动"],["jolts","JOLTS"],["confidence","信心指数"],["sentiment","情绪指数"],["speaks","发言"],["minutes","会议纪要"]];
function zhName(n){const l=n.toLowerCase();for(const [k,v] of ZH){if(l.includes(k))return v+" ("+n+")"}return n}
function renderCal(){
  const c=D&&D.calendar, box=$("cal"), td=$("today");
  if(!c||c.error){box.innerHTML="";td.textContent=(c&&c.error)?t("calErr")+": "+c.error:(ERR?"":t("noData"));$("calNote").textContent="";return;}
  const tz="Asia/Singapore", now=Date.now();
  const dayKey=ms=>new Date(ms).toLocaleDateString("en-CA",{timeZone:tz});
  const todayKey=dayKey(now), tmrKey=dayKey(now+864e5);
  const hhmm=ms=>new Date(ms).toLocaleTimeString("en-GB",{timeZone:tz,hour12:false,hour:"2-digit",minute:"2-digit"});
  const dlabel=ms=>{const k=dayKey(ms);if(k===todayKey)return t("today");if(k===tmrKey)return t("tmr");
    return new Date(ms).toLocaleDateString(lang==="zh"?"zh-CN":"en-GB",{timeZone:tz,weekday:"short",month:"numeric",day:"numeric"})};
  const evs=c.events.map(e=>Object.assign({ms:new Date(e.time).getTime()},e)).filter(e=>e.ms>=now-3*36e5);
  const todays=evs.filter(e=>dayKey(e.ms)===todayKey&&e.impact==="High");
  td.className="today"+(todays.length?" hot":"");
  td.textContent=todays.length?t("todayHas")+todays.map(e=>hhmm(e.ms)+" "+e.currency+" "+(lang==="zh"?zhName(e.title):e.title)).join("；"):t("todayNone");
  box.innerHTML="";$("calNote").textContent="";
}

function renderChart(){
  const box=$("chart"), lg=$("legend"), nt=$("chartNote"), hs=D&&D.history;
  if(!hs||hs.error||!hs.points||hs.points.length<2){box.innerHTML="";lg.innerHTML="";nt.textContent=(hs&&hs.error)?hs.error:"";return;}
  const P=hs.points, W=360, H=190, L=34, R=8, T=10, B=22;
  const vals=P.flatMap(p=>[p.usd,p.eur,p.gap,0]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=Math.max(5,(hi-lo)*0.08); lo-=pad; hi+=pad;
  const x=i=>L+(W-L-R)*i/(P.length-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const path=k=>P.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  const steps=[10,20,25,50,100,200]; const step=steps.find(s=>(hi-lo)/s<=5)||200;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+t("chartH")+'">';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    svg+='<line class="'+(v===0?"zero":"grid")+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'+
         '<text class="axis" x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+v+'</text>';
  }
  const lab=i=>P[i].date.slice(5);
  [[0,"start"],[Math.floor((P.length-1)/2),"middle"],[P.length-1,"end"]].forEach(([i,a])=>{
    svg+='<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+a+'">'+lab(i)+'</text>';
  });
  (hs.policy_changes||[]).forEach(c=>{
    const i=P.findIndex(p=>p.date>=c.date); if(i<0)return;
    svg+='<line class="chg" x1="'+x(i).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'"/>';
  });
  svg+='<path d="'+path("gap")+'" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>';
  svg+='<path d="'+path("eur")+'" fill="none" stroke="#2f7fb8" stroke-width="1.8"/>';
  svg+='<path d="'+path("usd")+'" fill="none" stroke="#c0562b" stroke-width="1.8"/>';
  svg+="</svg>";
  box.innerHTML=svg;
  const last=P[P.length-1], sg2=v=>(v>0?"+":"")+v;
  lg.innerHTML='<span><b style="background:#c0562b"></b>'+t("chUSD")+" "+sg2(last.usd)+'</span>'+
    '<span><b style="background:#2f7fb8"></b>'+t("chEUR")+" "+sg2(last.eur)+'</span>'+
    '<span><b style="background:var(--ink)"></b>'+t("chGap")+" "+sg2(last.gap)+'</span>'+
    ((hs.policy_changes||[]).length?'<span><b style="background:var(--warn)"></b>'+t("chChg")+'</span>':"");
  nt.textContent=t("chUp");
}

let d7k="usd";
const wk=ds=>new Date(ds+"T00:00:00Z").toLocaleDateString(lang==="zh"?"zh-CN":"en-GB",{weekday:"short",timeZone:"UTC"});
function renderD7(){
  const hs=D&&D.history, box=$("d7"), seg=$("seg7"), sm=$("d7sum");
  if(!hs||hs.error||!hs.points||hs.points.length<2){box.innerHTML="";seg.innerHTML="";sm.textContent="";return;}
  const P=hs.points.slice(-7), key=d7k, names={usd:t("chUSD"),eur:t("chEUR"),gap:t("chGap")};
  seg.innerHTML=["usd","eur","gap"].map(k=>'<button aria-pressed="'+(k===key)+'" data-k="'+k+'">'+names[k]+"</button>").join("")+'<button data-k="replay" aria-pressed="false">&#8635; '+t("replay")+"</button>";
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.k!=="replay")d7k=b.dataset.k;renderD7()});
  const v=P.map(p=>p[key]), W=360, H=170, L=16, R=16, T=28, B=34, n=P.length;
  let lo=Math.min(...v), hi=Math.max(...v); if(hi-lo<6){const m=(hi+lo)/2;lo=m-3;hi=m+3}
  const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  const x=i=>L+(W-L-R)*i/(n-1), y=val=>T+(H-T-B)*(1-(val-lo)/(hi-lo));
  const color=key==="usd"?"#c0562b":key==="eur"?"#2f7fb8":"var(--ink)";
  const sgn=z=>(z>0?"+":"")+z;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+t("d7H")+'">';
  if(lo<0&&hi>0) svg+='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'"/>';
  const d=v.map((val,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(val).toFixed(1)).join(" ");
  svg+='<path class="draw" pathLength="1" d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  P.forEach((p,i)=>{
    const last=i===n-1, dl=(2.4*i/(n-1)).toFixed(2);
    svg+='<g class="pt" style="animation-delay:'+dl+'s"><circle cx="'+x(i).toFixed(1)+'" cy="'+y(v[i]).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+color+'"/>'+
      '<text class="vl'+(last?" last":"")+'" x="'+x(i).toFixed(1)+'" y="'+(y(v[i])-9).toFixed(1)+'" text-anchor="middle">'+sgn(v[i])+'</text></g>'+
      '<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-18)+'" text-anchor="middle">'+p.date.slice(5)+'</text>'+
      '<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+wk(p.date)+'</text>';
  });
  svg+="</svg>"; box.innerHTML=svg;
  const a=P[n-2], b=P[n-1], diff=Math.round((b[key]-a[key])*10)/10;
  sm.textContent=t("d7prev")+" ("+a.date.slice(5)+") "+sgn(a[key])+" → "+t("d7last")+" ("+b.date.slice(5)+") "+sgn(b[key])+" bp · "+t("d7chg")+" "+sgn(diff)+" bp";
}

function render(){
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  // meta
  let m="";
  if(D&&D.updated){
    const days=(Date.now()-new Date(D.updated).getTime())/864e5;
    m=t("updated")+" "+new Date(D.updated).toLocaleString(lang==="zh"?"zh-CN":"en-GB",{timeZone:"Asia/Singapore",hour12:false,month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})+" SGT";
    if(days>4)m+=" · "+t("stale");
  }else if(ERR)m=t("err");
  $("meta").textContent=m;

  // 1
  [["USD","usd"],["EUR","eur"]].forEach(([id,k])=>{
    const d=D&&D[k],b=$("b"+id),box=$("d"+id);
    if(!d||d.error){b.textContent=t("noData");b.className="big neut";box.innerHTML="";return;}
    b.textContent=t("lean")[d.lean]+" "+sg(d.score_bp)+" bp";
    b.className="big "+(d.lean==="hawkish"?"hawk":d.lean==="dovish"?"dove":"neut");
    box.innerHTML=[[t("policy"),d.policy_rate+"%"],[t("y6"),d.short_yield_6m+"%"],[t("y2"),d.yield_2y+"%"],[t("chg"),sg(d.change_bp)+" bp"],[t("asof"),d.asof]]
      .map(r=>"<span>"+r[0]+"</span><b>"+r[1]+"</b>").join("");
  });
  const rel=D&&D.relative;
  $("rel").textContent=rel?t("relH")+t("rel")[rel.reading]+" ("+sg(rel.usd_minus_eur_bp)+" bp)":"";

  renderChart();
  renderD7();
  // 2
  const mu=D&&D.macro&&D.macro.usd, me=D&&D.macro&&D.macro.eur, pu=D&&D.usd, pe=D&&D.eur;
  const old=a=>{const d=new Date(String(a).length===7?a+"-01":a);return (Date.now()-d.getTime())/864e5>100};
  const cell=(o,suffix)=>(!o||o.value===null||o.value===undefined)?"—":
    f(o.value,suffix)+"<small>"+t("prev")+" "+f(o.prev,suffix)+" · "+o.asof+(old(o.asof)?' · <span style="color:var(--warn)">'+t("old")+"</span>":"")+"</small>";
  const pol=(d)=>(d&&d.policy_rate!==undefined)?d.policy_rate+"%<small>"+d.asof+"</small>":"—";
  const row=(label,a,b)=>"<tr><td>"+label+"</td><td>"+a+"</td><td>"+b+"</td></tr>";
  $("macro").innerHTML=
    row(t("policy"),pol(pu),pol(pe))+
    row(t("unemp"),cell(mu&&mu.unemployment,"%"),cell(me&&me.unemployment,"%"))+
    row(t("cpi"),cell(mu&&mu.cpi_yoy,"%"),cell(me&&me.cpi_yoy,"%"))+
    row(t("core"),cell(mu&&mu.core_cpi_yoy,"%"),cell(me&&me.core_cpi_yoy,"%"));
  const errs=[(mu&&mu.error)?"USD: "+mu.error:"",(me&&me.error)?"EUR: "+me.error:""].filter(Boolean).join(" | ");
  $("macroNote").textContent=errs;

  renderCal();
  // 4
  const c=D&&D.cot;
  if(!c||c.error){$("cot").innerHTML="";$("cotSub").textContent=(c&&c.error)?c.error:t("noData");return;}
  $("cotSub").textContent=t("cotAsof")+" "+c.asof;
  const pos=p=>p>=90?t("high"):p<=10?t("low"):t("mid");
  const card=(name,x)=>'<div class="card"><div class="cur">'+name+'</div><div class="big '+(x.net>=0?"dove":"hawk")+'">'+(x.net>=0?t("netLong"):t("netShort"))+" "+Math.abs(x.net).toLocaleString()+'</div><div class="rows">'+
    "<span>"+t("wk")+"</span><b>"+(x.change===null?"—":(x.change>0?"+":"")+x.change.toLocaleString())+"</b>"+
    "<span>"+t("oi")+"</span><b>"+x.pct_of_oi+"%</b>"+
    "<span>"+t("pctl")+"</span><b>"+x.percentile_1y+"% · "+pos(x.percentile_1y)+"</b></div></div>";
  $("cot").innerHTML=card(t("lev"),c.leveraged_funds)+card(t("am"),c.asset_managers);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){}render()});
fetch("data/lean.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;render()}).catch(()=>{ERR=true;render()});
render();
</script>
</body>
</html>
