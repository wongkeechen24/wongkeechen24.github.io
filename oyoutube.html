<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真正的无广告 YouTube 播放器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-box {
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #ff0000;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #player-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>🎬 纯净无广告播放器</h2>
    
    <div class="control-box">
        <input type="text" id="videoInput" placeholder="粘贴 YouTube 网址" />
        <button onclick="loadCleanVideo()">播放</button>
    </div>

    <div id="player-container">
        <!-- 默认使用 Invidious 镜像嵌入，天然剥离所有广告 -->
        <iframe id="cleanPlayer" src="https://yewtu.be/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <script>
        function loadCleanVideo() {
            const inputVal = document.getElementById('videoInput').value.trim();
            const videoId = extractVideoID(inputVal);
            
            if (videoId) {
                // 将视频 ID 传给开源的无广告镜像节点
                document.getElementById('cleanPlayer').src = "https://yewtu.be/embed/" + videoId;
            } else {
                alert('请输入正确的 YouTube 网址！');
            }
        }

        function extractVideoID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }
    </script>
</body>
</html>
