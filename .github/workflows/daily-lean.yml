name: Update market lean

on:
  schedule:
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/update_lean.py

      - name: Save result
        run: |
          git config user.name "lean-bot"
          git config user.email "lean-bot@users.noreply.github.com"
          git add data/lean.json
          git diff --staged --quiet || git commit -m "Update lean data"
          git push
