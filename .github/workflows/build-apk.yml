name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '请输入要打包的目标网址 (URL)'
        required: true
        default: 'https://'
      app_name:
        description: '请输入 App 名称'
        required: true
        default: 'MyCustomApp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 生成动态 WebView 工程
        run: |
          echo "正在为网址: ${{ github.event.inputs.target_url }} 生成打包配置..."
          # 这里可以加入 Android 源码模版，将目标网址写入主界面的 WebView 中
          # 随后调用 Gradle 编译出 APK

      # 编译完成后，将生成的 APK 上传至 Artifacts，供直接下载
      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: '*.apk'
