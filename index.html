<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kc 的网站</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    p {
      color: #888;
      margin-top: 0.5rem;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: #e8842c;
      color: #1a1a1d;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
      font-family: inherit;
    }

    .tool-btn:hover {
      background: #f2963f;
    }

    .tool-btn:active {
      transform: scale(0.98);
    }

    .guardian-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2a2418, #1e1a10);
      border: 1px solid #6b5a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 10;
    }

    .guardian-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
    }

    .guardian-btn:active {
      transform: translateY(0);
    }

    .guardian-btn svg {
      width: 22px;
      height: 22px;
      stroke: #e8d9a8;
    }

    /*
      锁定层
      position: fixed 会覆盖整个浏览器画面；
      z-index 确保它显示在所有页面内容之上。
    */
    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          rgba(40, 44, 54, 0.76),
          rgba(8, 9, 12, 0.97) 70%
        );

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      cursor: not-allowed;
      user-select: none;
    }

    .lock-card {
      width: min(420px, 100%);
      padding: 34px 26px 30px;

      background: rgba(22, 24, 30, 0.96);
      border: 1px solid #3c414b;
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(232, 132, 44, 0.08);

      animation: lockAppear 0.35s ease-out;
    }

    .lock-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      color: #e8842c;
      background: rgba(232, 132, 44, 0.12);
      border: 1px solid rgba(232, 132, 44, 0.45);
    }

    .lock-icon svg {
      width: 38px;
      height: 38px;
      stroke: currentColor;
    }

    .lock-card h2 {
      margin: 0;
      color: #ffffff;
      font-size: 23px;
      font-weight: 600;
    }

    .lock-card p {
      margin: 14px 0 0;
      color: #aeb3bd;
      font-size: 15px;
      line-height: 1.7;
    }

    .lock-warning {
      margin-top: 22px;
      padding: 12px 14px;

      color: #e9c99e;
      background: rgba(232, 132, 44, 0.08);
      border: 1px solid rgba(232, 132, 44, 0.22);
      border-radius: 10px;

      font-size: 13px;
      line-height: 1.6;
    }

    .lock-status {
      margin-top: 20px;
      color: #6f7682;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @keyframes lockAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- 原本的网站内容 -->
  <main>
    <h1>Hello, 这是我的第一个网站</h1>

    <button class="tool-btn" id="photoToolBtn">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <path d="M21 15l-5-5L5 21"></path>
      </svg>

      照片合并工具
    </button>
  </main>

  <!-- 右上角入口 -->
  <a
    href="kc-coins.html"
    class="guardian-btn"
    title="前往 $KC 币领取处"
    aria-label="守卫入口"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 2L4 5v6c0 5.5 3.4 9.7 8 11 4.6-1.3 8-5.5 8-11V5l-8-3z"></path>
      <circle cx="12" cy="10" r="2.5"></circle>
      <path d="M12 12.5c-2.2 0-4 1.3-4 3v1h8v-1c0-1.7-1.8-3-4-3z"></path>
    </svg>
  </a>

  <!-- 全屏锁定提示 -->
  <section
    class="lock-screen"
    id="lockScreen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lockTitle"
  >
    <div class="lock-card">
      <div class="lock-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <circle cx="12" cy="15" r="1"></circle>
          <path d="M12 16v1"></path>
        </svg>
      </div>

      <h2 id="lockTitle">网站暂时锁定</h2>

      <p>
        目前暂时不开放访问。<br>
        请稍后再回来查看最新消息。
      </p>

      <div class="lock-warning">
        ⚠️ 警告：此网站目前处于维护或限制访问状态。
      </div>

      <div class="lock-status">
        ACCESS TEMPORARILY DISABLED
      </div>
    </div>
  </section>

  <script>
    // 照片工具原本的功能
    document.getElementById("photoToolBtn").addEventListener("click", () => {
      let owned = [];

      try {
        owned = JSON.parse(localStorage.getItem("kc_owned") || "[]");
      } catch (error) {
        owned = [];
      }

      if (owned.includes("red")) {
        alert("✅ 验证通过：检测到 $KC-R 红色币，正在为你开启入口…");
        window.location.href = "photo-merge.html";
      } else {
        alert(
          "🔒 请投颜色币验证

此功能需持有对应颜色的 $KC 币方可进入。
即将带你前往领取页面。"
        );
        window.location.href = "kc-coins.html";
      }
    });

    /*
      防止使用鼠标右键查看页面内容。
      如果你不需要这个功能，可以删除下面这一段。
    */
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    /*
      防止常见的查看源代码快捷键。
      注意：前端代码无法真正阻止技术用户查看源码。
    */
    document.addEventListener("keydown", function (event) {
      const key = event.key.toLowerCase();

      if (
        event.key === "F12" ||
        (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key)) ||
        (event.ctrlKey && key === "u")
      ) {
        event.preventDefault();
      }
    });
  </script>

</body>
</html>
