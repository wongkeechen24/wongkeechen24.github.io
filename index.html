<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kc 的网站</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    p {
      color: #888;
      margin-top: 0.5rem;
    }
    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: #e8842c;
      color: #1a1a1d;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
      font-family: inherit;
    }
    .tool-btn:hover { background: #f2963f; }
    .tool-btn:active { transform: scale(0.98); }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
    }

    .guardian-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2a2418, #1e1a10);
      border: 1px solid #6b5a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 10;
    }

    .guardian-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(212,175,55,0.3);
    }

    .guardian-btn:active { transform: translateY(0); }

    .guardian-btn svg {
      width: 22px;
      height: 22px;
      stroke: #e8d9a8;
    }
  </style>
</head>
<body>
  <a href="kc-coins.html" class="guardian-btn" title="前往 $KC 币领取处" aria-label="守卫入口">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L4 5v6c0 5.5 3.4 9.7 8 11 4.6-1.3 8-5.5 8-11V5l-8-3z"/>
      <circle cx="12" cy="10" r="2.5"/>
      <path d="M12 12.5c-2.2 0-4 1.3-4 3v1h8v-1c0-1.7-1.8-3-4-3z"/>
    </svg>
  </a>

  <div>
    <h1>Hello, 这是我的第一个网站</h1>

    <button class="tool-btn" id="photoToolBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      照片合并工具
    </button>
  </div>

  <script>
    document.getElementById('photoToolBtn').addEventListener('click', () => {
      let owned = [];
      try {
        owned = JSON.parse(localStorage.getItem('kc_owned') || '[]');
      } catch (e) {
        owned = [];
      }

      if (owned.includes('red')) {
        alert('✅ 验证通过：检测到 $KC-R 红色币，正在为你开启入口…');
        window.location.href = 'photo-merge.html';
      } else {
        alert('🔒 请投颜色币验证\n\n此功能需持有对应颜色的 $KC 币方可进入。\n即将带你前往领取页面。');
        window.location.href = 'kc-coins.html';
      }
    });
  </script>
</body>
</html>
